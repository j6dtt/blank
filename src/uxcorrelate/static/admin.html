  h += `<form id="codeForm" class="cform" autocomplete="off"><input id="codeQ" maxlength="${j.limits.question}" value="${esc(CODE.draft)}" aria-label="Question about the code" `
    + `placeholder="${ab ? "What do you want to know about these lines?" : "e.g. Where is the time between two reads of Aternity set?"}"><button id="codeGo"${CODE.busy ? " disabled" : ""}>Ask</button></form>`
    + `<div class="cchips" id="codeChips">${j.examples.map(q => `<button type="button" data-ex="${esc(q)}">${esc(q)}</button>`).join("")}</div>`
    + `<div id="codeBusy" class="${CODE.aerr ? "bad" : "muted"}" style="margin-top:8px">${esc(CODE.aerr || codeBusyText())}</div>`
    + `<div id="codeAnswers">${CODE.answers.map(codeAnswer).join("")}</div>`
    + `<p class="fine">Answered with ${esc(j.service)}. The AI reads only this app's source files, through look-ups (search, a file's parts, lines, a setting), up to ${j.limits.steps} a question; `
    + `a follow-up remembers the last ${j.limits.history} answers. It cannot change or run code, and never sees config.yaml, .env, certificates or data: `
    + `it can say where a setting is and its default, not its value on this host. A file, a line, a name or a number it gives that is in none of what it looked at is marked. `
    + `The code under an answer is read from the files by the app, not written by the AI. Nothing is kept: a reload starts a new chat. `
    + (CODE.answers.length ? `<button type="button" class="link" data-cact="clear-answers">Clear the answers</button>` : "") + `</p>`;
  return h;
}
function codeRows(lines, first, mark, view) {  // lines of code with their numbers
  return `<div class="cbox${view ? " view" : ""}"${view ? ' id="codeView"' : ""}><div class="rows">`
    + lines.map((t, k) => `<div class="ln${first + k === mark ? " hit" : ""}" data-n="${first + k}"><span class="no">${first + k}</span><span class="tx">${esc(t)}</span></div>`).join("")
    + `</div></div>`;
}
function codeSnip(s, label) {  // lines read from the disk, with where they are and a way to them in Files
  const a = s.mark || s.start, b = s.mark || s.to || s.end;
  return `<div class="csnip"><div class="chead"><span>${label ? esc(label) + ": " : ""}<b>${esc(s.file)}</b> · ${codeSpan(a, b)}${s.part ? ` · ${esc(s.part)}` : ""}</span>`
    + `<button type="button" class="link" data-cf="${esc(s.file)}" data-ca="${a}" data-cb="${b}">Open in Files ▸</button></div>`
    + codeRows(s.lines, s.start, s.mark) + (s.more ? `<div class="muted small">… and ${plural(s.more, "more line")}: open them in Files.</div>` : "") + `</div>`;
}
function codeInline(s) {  // one line of an answer: names as code, bold, and each place a link to Files
  const cite = (text, mono) => {
    let out = "", at = 0;
    for (const m of text.matchAll(CODE_CITE)) {
      const f = codePick(m[1]);
      out += esc(text.slice(at, m.index));
      const shownAs = mono ? `<code>${esc(m[0])}</code>` : esc(m[0]);
      out += f ? `<button type="button" class="link cite" data-cf="${esc(f)}" data-ca="${m[2]}" data-cb="${m[3] || m[2]}">${shownAs}</button>` : shownAs;
      at = m.index + m[0].length;
    }
    return [out, at];
  };
  return String(s).split("`").map((part, k) => {
    if (k % 2) {  // in backticks: a name from the code, or a place
      const [out, at] = cite(part, true);
      return at === part.length && out ? out : `<code>${esc(part)}</code>`;
    }
    const [out, at] = cite(part, false);
    return (out + esc(part.slice(at))).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?![\w*])/g, "$1<i>$2</i>");
  }).join("");
}
function codeMd(text, blocks) {  // the AI's text: paragraphs, lists, bold, names; a code block it wrote is said to be its own
  const out = []; let list = null, fence = null, nth = 0;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trimEnd(); let m;
    if (/^\s*```/.test(line)) {
      if (fence === null) { close(); fence = []; continue; }
      const real = (blocks || [])[nth++];
      out.push(`<div class="cown"><div class="chead"><span>${real ? "As it stands in the files" : "Written by the AI: not lines read from the files"}</span></div>`
        + `<div class="cbox"><div class="rows">${fence.map(t => `<div class="ln"><span class="tx">${esc(t)}</span></div>`).join("")}</div></div></div>`);
      fence = null; continue;
    }
    if (fence !== null) { fence.push(raw); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${codeInline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d{1,2}[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${codeInline(m[1])}</li>`); }
    else if (/^\s*\|?\s*:?-{3,}/.test(line)) { /* a table's rule line */ }
    else if (!line.trim()) close();
    else { close(); out.push(`<p>${codeInline(line.replace(/^#+\s*/, "").replace(/^\|\s*|\s*\|$/g, "").replace(/\s*\|\s*/g, " · "))}</p>`); }
  }
  if (fence !== null) out.push(`<div class="cbox"><div class="rows">${fence.map(t => `<div class="ln"><span class="tx">${esc(t)}</span></div>`).join("")}</div></div>`);
  close(); return out.join("");
}
function codeStep(s, k) {  // one look-up under an answer
  let h = `<div class="cstep"><div class="t">${k + 1}. ${esc(s.title)}</div>`;
  if (s.notes.length) h += `<div class="muted">${s.notes.map(esc).join("<br>")}</div>`;
  if (s.code) h += `<div class="muted">${plural(s.code.end - s.code.start + 1, "line")} given to the AI. `
    + `<button type="button" class="link" data-cf="${esc(s.code.file)}" data-ca="${s.code.start}" data-cb="${s.code.end}">Open in Files ▸</button></div>`;
  if (s.rows.length) {
    const fi = s.columns.indexOf("File"), li = s.columns.indexOf("Line"), ri = s.columns.indexOf("Lines"), file = (s.summary || {}).file;
    const cell = (row, c) => {
      const v = row[c];
      if (c === li && fi >= 0) return `<button type="button" class="link" data-cf="${esc(row[fi])}" data-ca="${v}" data-cb="${v}">${esc(v)}</button>`;
      if (c === ri && file) { const [a, b] = String(v).split("-"); return `<button type="button" class="link" data-cf="${esc(file)}" data-ca="${a}" data-cb="${b || a}">${esc(v)}</button>`; }
      return s.columns[c] === "Code" || s.columns[c] === "Name" ? `<code>${esc(v)}</code>` : esc(v);
    };
    h += `<div class="tableWrap"><table class="clook"><thead><tr>${s.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`
      + s.rows.slice(0, CODE_ROWS).map(row => `<tr>${row.map((_, c) => `<td>${cell(row, c)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
    if (s.rows.length > CODE_ROWS) h += `<div class="muted">… and ${plural(s.rows.length - CODE_ROWS, "more row")} the AI was given.</div>`;
  }
  return h + `</div>`;
}
function codeAnswer(a) {
  let h = `<div class="cans"><div class="q">${esc(a.question)} · ${a.seconds} s · ${plural(a.steps.length, "look-up")}</div>`;
  if (a.about) {
    const n = a.about.end - a.about.start + 1, cut = Math.min(n, 30);
    h += codeSnip({ file: a.about.file, start: a.about.start, end: a.about.start + cut - 1, to: a.about.end, more: n - cut, lines: a.about.lines.slice(0, cut) }, "Asked about");
  }
  h += `<div class="a">${codeMd(a.answer, a.blocks)}</div>`;
  if (a.flagged.length) h += `<div class="mark">Not found in what it looked at: ${a.flagged.map(x => `<b>${esc(x.text)}</b> (${esc(x.why)})`).join("; ")}. Check ${a.flagged.length === 1 ? "it" : "them"} before using the answer.</div>`;
  if (a.note) h += `<div class="mark">${esc(a.note)}</div>`;
  if (a.shown.length) h += `<p class="muted small cshown">The lines it names, read from the files on this host:</p>` + a.shown.map(s => codeSnip(s)).join("");
  if (a.steps.length) h += `<details class="csteps"><summary>What it looked at (${a.steps.length})</summary>${a.steps.map(codeStep).join("")}</details>`;
  return h + `</div>`;
}
async function codeAsk(q, about) {
  const j = CODE.j;
  q = String(q ?? CODE.draft).trim();
  if (!q || CODE.busy || !j || !j.service) return;
  if (about === undefined) about = CODE.about;
  const aseq = CODE.aseq, sent = about ? { file: about.file, start: about.start, end: about.end } : null;
  Object.assign(CODE, { busy: true, aerr: "", doing: "", started: Date.now(), view: "ask" });
  codeDraw();
  CODE.timer = setInterval(() => { const b = $("codeBusy"); if (b && CODE.busy) b.textContent = codeBusyText(); }, 1000);
  try {
    const r = await fetch("admin/api/code/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, history: CODE.history.slice(-j.limits.history), about: sent }) });
    const job = await readJson(r);
    if (aseq !== CODE.aseq) return;
    if (r.status === 401) { showLogin(await me()); return; }
    if (!r.ok) throw new Error(job.detail || `HTTP ${r.status}`);
    let a = null, fails = 0;
    while (!a) {
      await new Promise(ok => setTimeout(ok, 1000));
      if (aseq !== CODE.aseq) return;
      let st, x;
      try {  // a dropped connection or a 502 while it is being answered: asked again, the question runs on
        const rr = await fetch("admin/api/code/job/" + job.id, { cache: "no-store" });
        st = rr.status; x = await readJson(rr);
        if (!rr.ok && st !== 401 && st !== 404) throw new Error(x.detail || `HTTP ${st}`);
        fails = 0;
      } catch (e) { if (++fails >= 5) throw e; continue; }
      if (aseq !== CODE.aseq) return;
      if (st === 401) { showLogin(await me()); return; }
      if (st === 404) throw new Error(x.detail || "the question was lost");
      const last = x.lines[x.lines.length - 1];
      CODE.doing = last ? last.slice(9).replace(/^Code chat: /, "") : "";
      if (x.done) {
        if (x.error) throw new Error(typeof x.error === "string" ? x.error : JSON.stringify(x.error));
        a = x.result;
      }
    }
    CODE.history.push({ q: a.question, a: a.answer, looked: a.looked });
    CODE.answers.unshift(a); CODE.answers = CODE.answers.slice(0, CODE_ANSWERS);
    if (CODE.draft.trim() === q) CODE.draft = "";  // a next question typed meanwhile stays
    if (CODE.about === about) CODE.about = null;
    if (CODE.view !== "ask") CODE.fresh = true;
  } catch (e) {
    if (aseq === CODE.aseq) CODE.aerr = "No answer: " + e.message;
  } finally {
    clearInterval(CODE.timer);
    if (aseq === CODE.aseq) {
      CODE.busy = false; CODE.doing = "";
      if (TAB.now === "code") {
        if (CODE.view === "ask") codeBody();
        else { const b = document.querySelector('#code [data-cv="ask"]'); if (b && CODE.fresh) b.textContent = "Ask · new answer"; }
      }
    }
  }
}

// -- Files --
function codeListHtml() {
  const j = CODE.j, r = CODE.sres;
  let h = `<p class="muted small">Every source file of the app as it runs on this host, with what it does (the file's own first sentence). `
    + `Click a file for its parts and its code. No AI is used here.</p>`
    + `<form id="codeSForm" class="cform" autocomplete="off"><input id="codeSq" maxlength="200" value="${esc(CODE.sq)}" aria-label="Search the code" `
    + `placeholder="Search the code: a word or a name, e.g. refresh_minutes"><button>Search</button>`
    + (r || CODE.serr ? `<button type="button" class="btn2" data-cact="search-clear">All files</button>` : "") + `</form>`;
  if (CODE.sbusy) return h + `<p class="muted">Searching…</p>`;
  if (CODE.serr) return h + `<p class="bad">${esc(CODE.serr)}</p>`;
  if (r) {
    h += `<p id="codeSTitle"><b>${esc(r.title)}</b></p>` + r.notes.map(n => `<p class="muted small">${esc(n)}</p>`).join("");
    if (r.rows.length) h += `<div class="tableWrap"><table class="clook" id="codeSRows"><thead><tr><th>File</th><th class="n">Line</th><th>In</th><th>Code</th></tr></thead><tbody>`
      + r.rows.map(x => `<tr><td>${esc(x[0])}</td><td class="n"><button type="button" class="link" data-cf="${esc(x[0])}" data-ca="${x[1]}" data-cb="${x[1]}">${fmt(x[1])}</button></td>`
        + `<td>${esc(x[2])}</td><td><code>${esc(x[3])}</code></td></tr>`).join("") + `</tbody></table></div>`;
    return h;
  }
  return h + `<div class="tableWrap"><table class="cfiles" id="codeFiles"><thead><tr><th>File</th><th class="n">Lines</th><th>What it does</th></tr></thead><tbody>`
    + j.files.map(f => `<tr><td><button type="button" class="link" data-cfile="${esc(f.file)}">${esc(f.file)}</button></td><td class="n">${fmt(f.lines)}</td><td>${esc(f.does)}</td></tr>`).join("")
    + `</tbody></table></div>`;
}
function codeParts() {  // the open file's parts that the chip and the box leave
  const f = CODE.file, q = CODE.pq.trim().toLowerCase();
  return f.items.map((it, k) => [it, k]).filter(([it]) => (!CODE.kind || CODE_KIND[it.kind] === CODE.kind)
    && (!q || `${it.full} ${it.route} ${it.doc} ${it.says}`.toLowerCase().includes(q)));
}
function codePartsHtml() {
  const rows = codeParts();
  return rows.length ? rows.map(([it, k]) => `<button type="button" class="part" data-part="${k}"><span class="k">${esc(it.kind)}</span><span class="nm">${esc(it.full)}</span>`
    + `<span class="n">${fmt(it.line)}</span><span class="d">${esc([it.route, it.doc || it.says].filter(Boolean).join(" · "))}</span></button>`).join("")
    : `<p class="muted small" style="margin:8px">${CODE.file.items.length ? "No part has that in its name or sentence." : "No part is listed for this file."}</p>`;
}
function codeSelHtml() {
  const s = CODE.sel, lim = CODE.j.limits.about;
  if (!s) return `<span class="muted small">To ask about lines: click a line number (Shift+click another for a range), drag over the code, or click a part.</span>`;
  const n = s.b - s.a + 1;
  return `<span id="codeSelSaid"><b>${n === 1 ? `Line ${fmt(s.a)}` : `Lines ${fmt(s.a)}-${fmt(s.b)}`}</b> picked${s.part ? ` (${esc(s.part)})` : ""}${n > lim ? `; the first ${lim} are given to the AI, it reads on by itself` : ""}</span>`
    + (CODE.j.service ? `<button type="button" data-cact="explain-sel"${CODE.busy ? " disabled" : ""}>Explain ${n === 1 ? "this line" : "these lines"} ▸</button>`
      + `<button type="button" class="btn2" data-cact="ask-sel">Ask about ${n === 1 ? "it" : "them"}…</button>` : "")
    + `<button type="button" class="btn2" data-cact="clear-sel">Clear</button>`;
}
function codeFileHtml() {
  const f = CODE.file, back = `<button type="button" class="link" data-cact="back">◂ ${CODE.sres ? "Back to the search" : "All files"}</button>`;
  if (!f) return `<p>${back}</p><p class="bad">${esc(CODE.ferr)}</p>`;
  const count = k => f.items.filter(it => !k || CODE_KIND[it.kind] === k).length;
  const more = f.about && f.about.replace(/\s+/g, " ").trim() !== f.does.replace(/ …$/, "").trim() && f.about.length > f.does.length;
  return `<p>${back}</p><div class="ph"><h3 id="codeFName">${esc(f.file)}</h3><span class="muted small">${plural(f.lines.length, "line")}</span>`
    + (CODE.j.service ? `<button type="button" class="btn2" data-cact="explain-file"${CODE.busy ? " disabled" : ""}>Explain this file ▸</button>` : "") + `</div>`
    + (f.error ? `<p class="note">${esc(f.error)}</p>` : "")
    + `<p class="cdoes${CODE.wide ? " all" : ""}">${esc(CODE.wide ? f.about : f.does)}${more ? ` <button type="button" class="link" data-cact="about-toggle">${CODE.wide ? "Show less ▴" : "Show all of it ▾"}</button>` : ""}</p>`
    + `<div class="cfile"><div><div class="tools"><input id="codePq" value="${esc(CODE.pq)}" placeholder="Find a part of this file" aria-label="Find a part of this file" autocomplete="off"></div>`
    + `<div class="ckinds" id="codeKinds">${CODE_KINDS.map(([k, w]) => `<button type="button" class="${CODE.kind === k ? "on" : ""}" data-ck="${k}">${w} (${fmt(count(k))})</button>`).join("")}</div>`
    + `<div class="cparts" id="codeParts">${codePartsHtml()}</div></div>`
    + `<div class="ccode"><div class="cselbar" id="codeSel">${codeSelHtml()}</div>${codeRows(f.lines, 1, 0, true)}</div></div>`;
}
function codeSelPaint() {  // the picked lines, lit in the code
  const box = $("codeView");
  if (!box) return;
  box.querySelectorAll(".ln.sel").forEach(el => el.classList.remove("sel"));
  const rows = box.firstElementChild.children, s = CODE.sel;
  if (s) for (let n = s.a; n <= s.b && n <= rows.length; n++) rows[n - 1].classList.add("sel");
  if ($("codeSel")) $("codeSel").innerHTML = codeSelHtml();
}
function codeScrollTo(n) {
  const box = $("codeView");
  if (!box || !n) return;
  const el = box.firstElementChild.children[n - 1];
  if (el) box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 4);
  if (box.getBoundingClientRect().top < 0 || box.getBoundingClientRect().top > innerHeight * 0.6) box.scrollIntoView({ block: "start" });
}
async function codeOpen(name, a, b) {  // a file in Files, at these lines when given
  const pick = codePick(name) || name, seq = ++CODE.seq;
  Object.assign(CODE, { view: "files", ferr: "" });
  if (!CODE.cache[pick]) {
    try {
      const r = await fetch("admin/api/code/file?name=" + encodeURIComponent(pick), { cache: "no-store" });
      const x = await readJson(r);
      if (seq !== CODE.seq) return;
      if (r.status === 401) { showLogin(await me()); return; }
      if (!r.ok) throw new Error(x.detail || `HTTP ${r.status}`);
      CODE.cache[pick] = x;
    } catch (e) {
      if (seq !== CODE.seq) return;
      Object.assign(CODE, { file: null, ferr: e.message.startsWith("There is") ? e.message : "The file could not be read: " + e.message });
      codeDraw(); return;
    }
  }
  const f = CODE.cache[pick];
  a = Math.min(Math.max(0, Number(a) || 0), f.lines.length); b = Math.min(Math.max(a, Number(b) || a), f.lines.length);
  if (CODE.file !== f) Object.assign(CODE, { file: f, kind: "", pq: "", wide: false, top: 0 });
  CODE.sel = a ? { a, b } : null;
  codeDraw();
  if (a) codeScrollTo(a); else scrollTo(0, 0);
}
async function codeSearch() {
  const q = CODE.sq.trim();
  if (q.length < 2) { Object.assign(CODE, { serr: "Type at least 2 characters.", sres: null }); codeBody(); return; }
  const seq = ++CODE.seq;
  Object.assign(CODE, { sbusy: true, serr: "", sres: null });
  codeBody();
  try {
    const r = await fetch("admin/api/code/search?q=" + encodeURIComponent(q), { cache: "no-store" });
    const x = await readJson(r);
    if (seq !== CODE.seq) return;
    if (r.status === 401) { showLogin(await me()); return; }
    if (r.ok) CODE.sres = x; else CODE.serr = x.detail || `HTTP ${r.status}`;
  } catch (e) {
    if (seq !== CODE.seq) return;
    CODE.serr = "UX Correlator did not answer: " + e.message;
  }
  CODE.sbusy = false;
  if (TAB.now === "code" && CODE.view === "files" && !CODE.file) codeBody();
}
function codeAboutSel() {  // the picked lines, as a question's subject
  const s = CODE.sel, f = CODE.file;
  return s && f ? { file: f.file, start: s.a, end: s.b, part: s.part || "" } : null;
}
$("code").addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "codeForm") codeAsk();
  else if (ev.target.id === "codeSForm") codeSearch();
});
$("code").addEventListener("input", ev => {
  if (ev.target.id === "codeQ") CODE.draft = ev.target.value;
  else if (ev.target.id === "codeSq") CODE.sq = ev.target.value;
  else if (ev.target.id === "codePq") { CODE.pq = ev.target.value; $("codeParts").innerHTML = codePartsHtml(); }
});
$("code").addEventListener("click", ev => {
  const t = ev.target, hit = sel => t.closest(sel);
  let b;
  if ((b = hit("[data-cv]"))) { if (CODE.view !== b.dataset.cv) { CODE.view = b.dataset.cv; codeDraw(); } }
  else if ((b = hit("[data-ex]"))) { CODE.draft = b.dataset.ex; codeAsk(b.dataset.ex); }
  else if ((b = hit("[data-cfile]"))) codeOpen(b.dataset.cfile);
  else if ((b = hit("[data-cf]"))) codeOpen(b.dataset.cf, b.dataset.ca, b.dataset.cb);
  else if ((b = hit("[data-ck]"))) { CODE.kind = b.dataset.ck; $("codeKinds").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); $("codeParts").innerHTML = codePartsHtml(); }
  else if ((b = hit("[data-part]"))) {
    const it = CODE.file.items[Number(b.dataset.part)];
    CODE.sel = { a: it.top, b: Math.max(it.top, it.end), part: it.full };
    codeSelPaint(); codeScrollTo(it.top);
  } else if ((b = hit("#codeView .no"))) {
    const n = Number(b.parentElement.dataset.n), s = CODE.sel;
    CODE.sel = ev.shiftKey && s ? { a: Math.min(s.anchor || s.a, n), b: Math.max(s.anchor || s.a, n), anchor: s.anchor || s.a } : { a: n, b: n, anchor: n };
    codeSelPaint();
  } else if ((b = hit("[data-cact]"))) {
    const act = b.dataset.cact, f = CODE.file;
    if (act === "back") { Object.assign(CODE, { file: null, ferr: "", sel: null, top: 0 }); codeDraw(); scrollTo(0, 0); }
    else if (act === "about-toggle") { CODE.wide = !CODE.wide; codeBody(); }
    else if (act === "clear-sel") { CODE.sel = null; codeSelPaint(); }
    else if (act === "explain-sel") {
      const ab = codeAboutSel(), n = ab.end - ab.start + 1;
      codeAsk(n === 1 ? "What does this line do?" : ab.part ? `What does ${ab.part} do, and how does it work?` : "What do these lines do?", ab);
    } else if (act === "ask-sel") { CODE.about = codeAboutSel(); CODE.view = "ask"; codeDraw(); $("codeQ").focus(); }
    else if (act === "explain-file") codeAsk(`What does ${f.file} do, and what are its main parts?`, { file: f.file, start: 0, end: 0 });
    else if (act === "clear-about") { CODE.about = null; codeBody(); }
    else if (act === "clear-answers") { CODE.answers = []; CODE.history = []; codeBody(); }
    else if (act === "search-clear") { Object.assign(CODE, { sres: null, serr: "", sq: "" }); codeBody(); }
  }
});
$("code").addEventListener("mouseup", () => {  // lines dragged over in the code are the lines picked
  const box = $("codeView"), s = getSelection();
  if (!box || !s || s.isCollapsed || !box.contains(s.anchorNode) || !box.contains(s.focusNode)) return;
  const line = node => { const el = (node.nodeType === 1 ? node : node.parentElement).closest(".ln"); return el ? Number(el.dataset.n) : 0; };
  let a = line(s.anchorNode), b = line(s.focusNode);
  if (!a || !b) return;
  if (a > b) [a, b] = [b, a];
  CODE.sel = { a, b, anchor: a };
  codeSelPaint();
});


function draw(j) {
  const sel = $("day");
  sel.innerHTML = j.dates.map(d => `<option value="${esc(d)}"${d === j.date ? " selected" : ""}>${esc(dayName(d, j.dates[0]))}</option>`).join("");
  $("asOf").textContent = j.today ? `as of ${j.as_of_local} ${j.zone}` : "";
  const page = $("page");
  if (j.missing) { page.innerHTML = `<section class="panel"><p class="muted">Nothing was recorded on ${esc(dayName(j.date, j.dates[0]))}.</p></section>`; return; }
  page.innerHTML = peoplePanel(j) + `<div class="grid2">${usePanel(j)}${askPanel(j)}</div>`
    + `<div class="grid2">${carePanel(j)}${daysPanel(j)}</div>` + loadPanel(j);
  page.querySelectorAll("svg.bars g.day").forEach(g => g.addEventListener("click", () => load(j.days[Number(g.dataset.i)].date)));
  adLook();  // names from AD, filled in when it answers
}

$("day").addEventListener("change", ev => load(ev.target.value));
$("out").addEventListener("click", async () => {
  TAB.now = ""; TAB.seq.stats++; TAB.seq.sv++; clearTimeout(state.timer); clearTimeout(SV.timer);  // reads under way are dropped
  try { await fetch("admin/api/logout", { method: "POST" }); } catch (e) { /* the cookie goes with the session anyway */ }
  state = { day: "", data: null, timer: null };
  Object.assign(AD, { users: {}, pcs: {}, res: null });  // what AD said goes with the session
  Object.assign(SV, { j: null, text: "", timer: null, dev: {}, open: null, sq: "", sres: null, serr: "", sbusy: false, sseq: SV.sseq + 1, sall: {} });
  Object.assign(ACT, { user: "", j: null, err: "", busy: false, app: "", seq: ACT.seq + 1 });
  $("act").innerHTML = "";  // drawn again, empty, at the next login
  clearInterval(CODE.timer);  // the code chat goes with the session: its answers, the files read, a question under way
  Object.assign(CODE, { view: "ask", j: null, err: "", seq: CODE.seq + 1, aseq: CODE.aseq + 1, file: null, ferr: "", cache: {}, kind: "", pq: "", sel: null,
    wide: false, top: 0, sq: "", sres: null, sbusy: false, serr: "", about: null, answers: [], history: [], busy: false, doing: "", aerr: "", draft: "", fresh: false });
  $("code").innerHTML = "";
  showLogin(await me());
});

(async () => {
  try {
    const m = await me();
    if (m.in) openTab(tabOfLink()); else showLogin(m);
  } catch (e) { $("err").textContent = "UX Correlator did not answer: " + e.message; }
})();
