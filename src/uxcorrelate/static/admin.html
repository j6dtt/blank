<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<script>(() => { try { const t = localStorage.getItem("uxTheme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) { /* no storage: the PC's own setting decides */ } })();</script>
<style>
  /* The admin page (docs/admin-roadmap.md): the main app's look (parchment, archive green, brass) */
  :root {
    --bg: #f3eddf; --panel: #fffcf4; --text: #2a261f; --muted: #6b6252; --border: #e2d7c0;
    --accent: #2f5d46; --bad: #a8382d; --warn: #b26f12; --ok: #3d7a4f;
    --head: #1f3b2e; --head-text: #f4ead2; --head-muted: #c8bb98; --brass: #b08d45;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --accent2: #93b8a0; --band: #e6d9bb; --faint: #f6f0e2;  /* SecureView: weekend bars, the usual's band, open rows */
    --grey: #c9bfa8;  /* SecureView: the groups that are not a department */
    --on: #fff;  /* text on a filled button */
    color-scheme: light;
  }
  /* Dark ("Night archive", the main page's: keep in step with index.html): when the switch in the top bar says
     Dark (data-theme on <html>, kept in this browser under the main page's key), or the PC is set to dark and
     nobody has picked here. The same values twice: CSS cannot share them between the two rules. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15140f; --panel: #1e1c16; --text: #ece3cf; --muted: #a99f88; --border: #363228;
      --accent: #63a67f; --bad: #e5746a; --warn: #e3a548; --ok: #7cc492;
      --head: #10231a; --head-muted: #b3a682; --brass: #c9a55a; --on: #14110b; color-scheme: dark;
      --accent2: #35604a; --band: #3a3529; --faint: #25221b; --grey: #4a4537;
    }
  }
  :root[data-theme="dark"] {
      --bg: #15140f; --panel: #1e1c16; --text: #ece3cf; --muted: #a99f88; --border: #363228;
      --accent: #63a67f; --bad: #e5746a; --warn: #e3a548; --ok: #7cc492;
      --head: #10231a; --head-muted: #b3a682; --brass: #c9a55a; --on: #14110b; color-scheme: dark;
      --accent2: #35604a; --band: #3a3529; --faint: #25221b; --grey: #4a4537;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }  /* a short tab and a long one are as wide: the bar wraps the same on both */
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
           border-bottom: 3px solid var(--brass); background: var(--head); color: var(--head-text); }
  .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; }
  /* the two tabs, as the main page's: folder tabs on the brass rule; the open one is parchment and joins the page */
  nav { display: flex; gap: 4px; align-items: flex-end; margin-bottom: -3px; }
  nav[hidden] { display: none; }
  #statsBar.off { visibility: hidden; }  /* kept in its place: the bar is as tall on both tabs, nothing jumps */
  nav button { white-space: nowrap; background: rgba(244, 234, 210, .07); color: var(--head-muted);
               border: 1px solid rgba(176, 141, 69, .5); border-bottom: 0; border-radius: 7px 7px 0 0;
               padding: 9px 16px; margin-bottom: 3px; font: 600 12px/18px var(--serif); letter-spacing: .12em; text-transform: uppercase; }
  nav button:hover, nav button:focus-visible { color: var(--head-text); background: rgba(244, 234, 210, .14); }
  nav button.on { background: var(--bg); color: var(--accent); border: 1px solid var(--brass); border-top: 3px solid var(--brass);
                  border-bottom: 0; padding: 9px 18px 12px; margin-bottom: 0; }
  #statsBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 640px) {  /* a phone: the main page's smaller tabs; four are wider than 400 px, so they slide
                                  sideways as the main page's do (the whole page scrolled sideways by 27 px) */
    nav { overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: none; padding-left: 12px; padding-right: 12px; font-size: 11px; letter-spacing: .08em; }
  }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand small { color: var(--head-muted); font: 600 16px/1.1 var(--serif); font-variant: small-caps; letter-spacing: .03em; }
  .brand i { width: 2px; align-self: stretch; min-height: 24px; background: var(--brass); }
  .brand h1 { font: 600 22px/1.1 var(--serif); margin: 0; }
  .tag { font: 600 12px/18px var(--serif); letter-spacing: .12em; text-transform: uppercase; color: var(--head); background: var(--brass);
         border-radius: 4px; padding: 1px 8px; }
  #bar { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  /* Parchment | Dark, as the main page's: at the right of the bar, also on the log-in screen */
  .themeSeg { display: inline-flex; flex: none; margin-left: auto; border: 1px solid var(--brass); border-radius: 999px; overflow: hidden; }
  #bar:not([hidden]) + .themeSeg { margin-left: 0; }
  .themeSeg button { background: none; border: 0; border-radius: 0; padding: 4px 11px; font: 600 12px system-ui, sans-serif; color: var(--head-muted); }
  .themeSeg button:hover, .themeSeg button:focus-visible { color: var(--head-text); }
  .themeSeg button.on, .themeSeg button.on:hover { background: var(--brass); color: #1b1a14; }
  #bar[hidden], #page[hidden] { display: none; }  /* a CSS display wins over hidden without its own rule */
  #page { display: contents; }
  #bar select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--brass); background: var(--head); color: var(--head-text); font: inherit; }
  #bar button { background: transparent; color: var(--head-text); border: 1px solid var(--brass); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
         display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-top: 2px solid var(--brass); border-radius: 4px;
           padding: 16px; box-shadow: 0 1px 2px rgba(60, 45, 20, .06); min-width: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; }
  .grid2 > * { min-width: 0; }
  h2 { font: 600 17px var(--serif); margin: 0 0 10px; color: var(--accent); }
  h3 { font: 600 14px var(--serif); margin: 14px 0 6px; }
  h3:first-child { margin-top: 0; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  input { padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tableWrap { overflow-x: auto; }
  table.people { min-width: 640px; }  /* a phone scrolls it in its frame: the desktops' AD lines stay readable */
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .note { border-left: 4px solid var(--warn); background: var(--bg); padding: 8px 12px; margin: 0 0 12px; }
  .err { color: var(--bad); white-space: pre-wrap; }
  .err:empty { display: none; }
  .nums { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 8px; }
  .nums div { display: grid; }
  .nums b { font: 700 22px/1.15 var(--serif); }
  .nums span { font-size: 12px; color: var(--muted); }
  /* bars: one series each, the accent; numbers in text colours */
  svg.bars { display: block; width: 100%; height: auto; }
  svg.bars rect.v { fill: var(--accent); }
  svg.bars rect.hit { fill: transparent; }
  svg.bars rect.hit:hover + rect.v, svg.bars rect.sel { fill: var(--brass); }
  svg.bars text { fill: var(--muted); font-size: 10px; }
  svg.bars line { stroke: var(--border); }
  svg.bars g.day { cursor: pointer; }
  .hl { display: grid; grid-template-columns: minmax(110px, 42%) 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
  .hl i { display: block; height: 10px; border-radius: 0 3px 3px 0; background: var(--accent); min-width: 2px; }
  .hl .n { text-align: right; font-variant-numeric: tabular-nums; }
  ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ul.plain li { border-left: 3px solid var(--border); padding: 1px 0 1px 10px; }
  ul.plain li.bad { border-color: var(--bad); color: var(--text); }
  .q { max-height: 420px; overflow-y: auto; }
  .ad [title]:not([title=""]) { border-bottom: 1px dotted var(--muted); cursor: help; }
  /* SecureView (the devices people sit at; secureview.py) */
  #sv[hidden] { display: none; }
  .ph { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .ph h2 { margin: 0; }
  .subtabs { display: flex; gap: 4px; }
  .subtabs button { font: 600 13px var(--serif); letter-spacing: .08em; text-transform: uppercase; padding: 5px 14px; border-radius: 4px 4px 0 0;
    border: 1px solid var(--border); border-bottom: 2px solid var(--border); background: var(--faint); color: var(--muted); }
  .subtabs button.on { background: var(--panel); color: var(--accent); border-bottom-color: var(--brass); }
  .asof { color: var(--muted); font-size: 12px; margin-left: auto; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 8px 24px; }
  .two > * { min-width: 0; }
  .two + .two { margin-top: 14px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; }
  .tools input, .tools select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  .tools input { flex: 1 1 200px; min-width: 0; }
  .btn2 { padding: 6px 12px; border: 1px solid var(--accent); color: var(--accent); background: transparent; font-size: 13px; }
  .link { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; font-weight: 600; text-align: left; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px; margin: 4px 0 10px; max-width: 820px; }
  .chip { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; background: var(--bg); text-align: left; color: var(--text); font-weight: 400; }
  .chip b { font: 700 18px var(--serif); display: block; font-variant-numeric: tabular-nums; }
  .chip span { font-size: 12px; color: var(--muted); }
  .chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--panel); }
  svg.ch { width: 100%; height: auto; display: block; }
  svg.ch text { fill: var(--muted); font-size: 10px; }
  svg.ch .v { fill: var(--accent); } svg.ch .v.we { fill: var(--accent2); } svg.ch .v.now { fill: var(--brass); }
  svg.ch .v.part { fill: var(--panel); stroke: var(--accent); stroke-width: 1; }  /* a day not read in full: hollow */
  svg.ch .band { fill: var(--band); } svg.ch line { stroke: var(--border); }
  svg.ch g.h:hover .v { fill: var(--brass); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-left: 4px; vertical-align: 1px; }
  .row21 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px 24px; }
  .row21 > * { min-width: 0; }
  @media (max-width: 760px) { .row21 { grid-template-columns: minmax(0, 1fr); } }
  /* By department: rows across the page, in columns read down each one, most first (the user's pick B, 2026-11-17);
     a row is a button: it shows that department's devices in the list */
  .dcols { columns: 3 250px; column-gap: 28px; }
  .dr { break-inside: avoid; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(48px, 1fr) 5.6em; gap: 10px; align-items: center;
        width: 100%; padding: 3px 4px; border: 0; border-radius: 4px; background: transparent; color: var(--text); font: inherit; font-size: 13px;
        font-weight: 400; text-align: left; }
  .dcols.hist { columns: 2 380px; }  /* History: "114 of 134" then "· 12 silent 90+" in a column of its own, rows of one height */
  .dcols.hist .dr { grid-template-columns: minmax(0, 1.4fr) minmax(40px, 1fr) 6.8em 7.8em; }
  .dr .nt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 560px) {  /* a phone: History's "· 12 silent 90+" under its row, so the names keep their room */
    .dcols.hist .dr { grid-template-columns: minmax(0, 1.4fr) minmax(40px, 1fr) 6.8em; row-gap: 0; }
    .dr .nt { grid-column: 1 / -1; text-align: right; }
    .dr .nt:empty { display: none; }
  }
  .dr > * { min-width: 0; }
  .dr:hover { background: var(--faint); }
  .dr:hover .nm { color: var(--accent); text-decoration: underline; }
  .dr.on { background: var(--faint); box-shadow: inset 3px 0 0 var(--brass); }
  .dr.on .nm { color: var(--accent); font-weight: 700; }
  .dr .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dr .trk { position: relative; height: 10px; background: var(--faint); border-radius: 0 3px 3px 0; }
  .dr:hover .trk, .dr.on .trk { background: var(--bg); }
  .dr .trk i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 3px 3px 0; }
  .dr.not .trk i { background: var(--grey); }
  .dr .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.sv { min-width: 760px; }
  tr.open > td { background: var(--faint); }
  tr.det > td { background: var(--faint); padding: 6px 12px 14px 24px; }
  .cal { display: grid; grid-template-columns: repeat(45, 1fr); gap: 2px; max-width: 640px; margin: 4px 0 8px; }
  .cal i { aspect-ratio: 1; border-radius: 2px; background: var(--band); }
  .cal i.u { background: var(--accent); } .cal i.w { opacity: .45; }
  .fine { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  /* SecureView's Search: a match each, its days in a table (the user's request, 2026-11-17) */
  .match { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 12px; }
  .match h3 { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; margin: 0 0 6px; }
  .match h3 .link { font-size: 14px; }
  .match h3 .ad { font: 400 13px system-ui, -apple-system, Segoe UI, sans-serif; }
  table.sr { min-width: 600px; }
  .sect { font: 600 13px var(--serif); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
  .adp { display: grid; gap: 4px; margin: 0 0 8px; }
  /* Actions: every action of one user today */
  #act[hidden] { display: none; }
  table.act { min-width: 860px; }
  td.t { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.Major { color: var(--bad); font-weight: 600; } td.Minor { color: var(--warn); }
  /* Code: this app's own source, listed, shown and asked about (code_chat.py) */
  #code[hidden] { display: none; }
  #code code, .cbox, .cparts .nm { font-family: ui-monospace, Consolas, "Cascadia Mono", Menlo, monospace; }
  #code code { font-size: 12.5px; background: var(--faint); border-radius: 3px; padding: 0 3px; overflow-wrap: anywhere; }
  .cform { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 0; }
  .cform input { flex: 1 1 220px; min-width: 0; }
  .cchips, .ckinds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cchips button, .ckinds button { background: var(--bg); color: var(--accent); border: 1px solid var(--border); padding: 4px 10px; font-size: 12px; font-weight: 400; }
  .ckinds button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--panel); font-weight: 600; }
  .cabout { border-left: 4px solid var(--brass); background: var(--faint); padding: 6px 10px; margin: 0 0 8px; }
  .cans { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 14px; }
  .cans .q { color: var(--muted); font-size: 12px; }
  .cans .a { font-size: 15px; margin: 4px 0 8px; max-width: 88ch; }
  .cans .a p { margin: 6px 0; }
  .cans .a ul, .cans .a ol { margin: 6px 0; padding-left: 22px; }
  .cans .a li { margin: 3px 0; }
  .cans .mark { font-size: 12px; color: var(--warn); margin: 6px 0; }
  .cans .cshown { margin: 10px 0 0; }
  .link.cite { font-weight: 400; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .chead { display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  .chead b { color: var(--text); }
  /* lines of code with their numbers: the box scrolls, never the page */
  .cbox { border: 1px solid var(--border); border-radius: 4px; background: var(--bg); overflow: auto; font-size: 12.5px; line-height: 1.5; max-width: 100%; }
  .cbox.view { max-height: 72vh; position: relative; }
  .cbox .rows { display: inline-block; min-width: 100%; vertical-align: top; }
  .cbox .ln { display: flex; }
  .cbox .no { flex: none; width: 6ch; padding: 0 8px 0 4px; text-align: right; color: var(--muted); user-select: none; border-right: 1px solid var(--border);
              position: sticky; left: 0; background: var(--bg); font-variant-numeric: tabular-nums; }
  .cbox .tx { white-space: pre; padding: 0 10px; flex: 1 0 auto; }
  .cbox.view .no { cursor: pointer; }
  .cbox.view .no:hover { color: var(--accent); font-weight: 700; }
  .cbox .ln.sel .tx, .cbox .ln.hit .tx { background: color-mix(in srgb, var(--brass) 24%, transparent); }
  .cbox .ln.sel .no, .cbox .ln.hit .no { background: color-mix(in srgb, var(--brass) 38%, var(--bg)); color: var(--text); font-weight: 700; }
  details.csteps { font-size: 12px; margin-top: 8px; }
  details.csteps > summary { cursor: pointer; color: var(--accent); }
  .cstep { margin: 10px 0 0; }
  .cstep .t { font-weight: 600; font-size: 13px; }
  table.clook { font-size: 12px; min-width: 560px; }
  table.clook td { overflow-wrap: anywhere; }
  table.clook td:first-child { white-space: nowrap; }
  table.cfiles td:first-child { white-space: nowrap; }
  table.cfiles { min-width: 520px; }
  .cdoes { max-width: 100ch; margin: 0 0 10px; }
  .cdoes.all { white-space: pre-wrap; }
  .cfile { display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 2.6fr); gap: 12px 16px; align-items: start; }
  .cfile > * { min-width: 0; }
  .cfile .tools { margin-top: 0; }
  .cparts { max-height: 72vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; margin-top: 8px; }
  .cparts .part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; width: 100%; text-align: left; background: transparent; color: var(--text);
                  font-weight: 400; padding: 5px 8px; border-radius: 0; border-bottom: 1px solid var(--border); }
  .cparts .part:hover { background: var(--faint); }
  .cparts .k { grid-column: 1 / -1; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cparts .nm { font-size: 12.5px; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
  .cparts .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cparts .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .cparts .d:empty { display: none; }
  .cselbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 34px; margin-bottom: 6px; }
  .cselbar button { padding: 5px 12px; font-size: 13px; }
  @media (max-width: 860px) {  /* a narrow window: the parts over the code */
    .cfile { grid-template-columns: minmax(0, 1fr); }
    .cparts { max-height: 34vh; }
  }
  #login { max-width: 460px; justify-self: center; width: 100%; }
  #login form { display: grid; gap: 10px; }
</style>
</head>
<body>
<header><div class="top">
  <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true">
    <path d="M15 1 L28 5 V16 C28 25 22 30 15 33 C8 30 2 25 2 16 V5 Z" fill="none" stroke="var(--brass)" stroke-width="2"/>
    <text x="15" y="21" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700"
      fill="var(--brass)" style="fill:var(--brass)">J6</text></svg>
  <div class="brand"><small>J6 Preservation Society</small><!--title--></div>
  <span class="tag">Admin</span>
  <div id="bar" hidden>
    <span id="statsBar"><label class="small">Day <select id="day" aria-label="Day"></select></label>
    <span class="small" id="asOf" style="color: var(--head-muted)"></span></span>
    <button id="out">Log out</button>
  </div>
  <span class="themeSeg" id="themeSeg" role="group" aria-label="Look of the page"><button type="button" data-theme-pick="light">Parchment</button><button type="button" data-theme-pick="dark">Dark</button></span></div>
  <nav id="tabs" role="tablist" hidden><button id="tabStats" role="tab" data-t="stats">Statistics</button><button id="tabSv" role="tab" data-t="sv">SecureView</button><button id="tabAct" role="tab" data-t="act">Actions</button><button id="tabCode" role="tab" data-t="code">Code</button></nav>
</header>
<main id="main">
  <section class="panel" id="login" hidden>
    <h2>Log in</h2>
    <div id="loginBody"></div>
    <p class="err" id="loginErr"></p>
  </section>
  <p class="err" id="err"></p>
  <section class="panel" id="sv" hidden></section>
  <section class="panel" id="act" hidden></section>
  <section class="panel" id="code" hidden></section>
  <div id="page" hidden></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
// ---- The look: Parchment or Dark, as on the main page and under its key, so both pages agree. A click sets
// data-theme on <html> and keeps it in this browser; until someone picks, the PC's own setting decides. ----
const THEME_KEY = "uxTheme", themeDark = matchMedia("(prefers-color-scheme: dark)");
const themeNow = () => document.documentElement.dataset.theme || (themeDark.matches ? "dark" : "light");
function drawTheme() {
  for (const b of $("themeSeg").children) {
    const on = b.dataset.themePick === themeNow();
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
  }
}
$("themeSeg").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-theme-pick]");
  if (!b) return;
  document.documentElement.dataset.theme = b.dataset.themePick;
  try { localStorage.setItem(THEME_KEY, b.dataset.themePick); } catch (e) { /* no storage: kept until the page is closed */ }
  drawTheme();
});
themeDark.addEventListener("change", drawTheme);
window.addEventListener("storage", (ev) => {  // picked on the main page, or in another window
  if (ev.key !== THEME_KEY || (ev.newValue !== "dark" && ev.newValue !== "light")) return;
  document.documentElement.dataset.theme = ev.newValue;
  drawTheme();
});
drawTheme();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : (many || one + "s")}`;
function dur(s) {  // seconds in words: 45 s, 12 min, 1 h 05 min
  if (s == null) return "–";
  s = Math.round(s);
  if (s < 120) return `${s} s`;
  const m = Math.round(s / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
}
async function readJson(r) {
  const text = await r.text();
  try { return JSON.parse(text); } catch (e) {
    return { detail: `UX Correlator answered HTTP ${r.status}${r.status >= 502 ? ": the app may be restarting" : ""}.` };
  }
}
// Where an investigation was started (InvestigateBody.source; the Care list's own runs are "care-auto")
const BY = { investigate: "Investigate tab", today: "Investigate ▸ on Today", care: "Investigate again on the Care list",
  "care-auto": "Care list, by itself", ask: "Ask anything", software: "Investigate ▸ on Software",
  startups: "Investigate ▸ on Start-ups", API: "The API (no page)" };
const KIND = { virtual: "virtual desktop", physical: "physical PC" };

let state = { day: "", data: null, timer: null };

async function me() {
  const r = await fetch("admin/api/me", { cache: "no-store" });
  return readJson(r);
}

function showLogin(m) {
  TAB.now = "";  // no tab loads or keeps its minute until the next login; reads under way are dropped
  TAB.seq.stats++; TAB.seq.sv++;
  clearTimeout(state.timer); clearTimeout(SV.timer); SV.timer = null;
  $("bar").hidden = true; $("tabs").hidden = true; $("page").hidden = true; $("sv").hidden = true; $("act").hidden = true; $("code").hidden = true;
  $("login").hidden = false;
  $("err").textContent = "";
  const box = $("loginBody");
  if (!m.set) {
    box.innerHTML = `<p>No admin password is set. Put <code>ADMIN_PASSWORD=…</code> in the app's <code>.env</code>, then <code>docker compose up -d</code> (a restart does not read <code>.env</code> again; on Kubernetes, load the Secret again and restart the pod).</p>`;
    return;
  }
  if (!m.https) {
    const url = `https://${location.hostname}:8444/admin`;
    box.innerHTML = `<p>Log in on the HTTPS address: on plain HTTP the password can be read on the network.</p>
      <p><a href="${esc(url)}">${esc(url)}</a> <span class="muted small">(Docker's HTTPS port)</span></p>`;
    return;
  }
  box.innerHTML = `<form id="lf"><label class="small muted" for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button></form>`;
  $("pw").focus();
  $("lf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const b = ev.target.querySelector("button");
    b.disabled = true; $("loginErr").textContent = "";
    try {
      const r = await fetch("admin/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("pw").value }) });
      const j = await readJson(r);
      if (!r.ok) { $("loginErr").textContent = j.detail || `HTTP ${r.status}`; $("pw").select(); return; }
      openTab(tabOfLink());
    } catch (e) {
      $("loginErr").textContent = "UX Correlator did not answer: " + e.message;
    } finally { b.disabled = false; }
  });
}

// The Statistics tab: read while it is open, each minute while it shows today
async function load(day = state.day) {
  if (TAB.now !== "stats") return;  // a minute that ends on the other tab, or after logging out
  clearTimeout(state.timer);
  const seq = ++TAB.seq.stats;  // the latest read wins (a day picked while one runs); one sent before a log-out is dropped
  const say = t => { if (TAB.now === "stats") $("err").textContent = t; };
  let r, j;
  try {
    r = await fetch("admin/api/usage" + (day ? "?day=" + encodeURIComponent(day) : ""), { cache: "no-store" });
    j = await readJson(r);
  } catch (e) {
    if (seq !== TAB.seq.stats) return;
    say("UX Correlator did not answer: " + e.message + ". Trying again in a minute.");
    state.timer = setTimeout(load, 60000);
    return;
  }
  if (seq !== TAB.seq.stats) return;
  if (r.status === 401) { showLogin(await me()); return; }
  if (!r.ok) { say(j.detail || `HTTP ${r.status}`); return; }
  say("");
  state.day = j.date; state.data = j;
  draw(j);
  if (j.today) state.timer = setTimeout(() => { if (!document.hidden) load(); else state.timer = setTimeout(load, 60000); }, 60000);
}

// ---------- the tabs: Statistics (the panels above), SecureView, Actions and Code; the open one is in the link ----------
// Only the open tab is read and kept up to date; the other keeps what it showed (and its sub-tab, box and open
// row) and is read again the moment it is opened.
const TABS = { stats: "statistics", sv: "secureview", act: "actions", code: "code" };
const TAB = { now: "", scroll: {}, seq: { stats: 0, sv: 0 } };
const tabOfLink = () => Object.keys(TABS).find(k => location.hash === "#" + TABS[k]) || "stats";
function openTab(t) {
  const was = TAB.now;
  if (was && was !== t) TAB.scroll[was] = scrollY;
  TAB.now = t;
  clearTimeout(state.timer); clearTimeout(SV.timer); SV.timer = null;
  for (const b of $("tabs").querySelectorAll("button")) {
    b.classList.toggle("on", b.dataset.t === t);
    b.setAttribute("aria-selected", String(b.dataset.t === t));
  }
  $("login").hidden = true; $("tabs").hidden = false; $("bar").hidden = false;
  $("statsBar").classList.toggle("off", t !== "stats");  // the Day box and "as of" are the Statistics panels'
  $("page").hidden = t !== "stats"; $("sv").hidden = t !== "sv"; $("act").hidden = t !== "act"; $("code").hidden = t !== "code";
  $("err").textContent = "";
  if (location.hash !== "#" + TABS[t]) history.replaceState(null, "", "#" + TABS[t]);
  if (t === "stats") {
    if (!state.data) $("page").innerHTML = `<section class="panel"><p class="muted">Loading…</p></section>`;
    load();
  } else if (t === "sv") {
    if (!SV.j) $("sv").innerHTML = `<h2>SecureView</h2><p class="muted">Loading…</p>`;
    svLoad();
  } else if (t === "code") {  // Code: its list is read once (the source changes only with a restart): no minute
    if (!CODE.j) { codeDraw(); codeLoad(); } else if (!$("codeBody")) codeDraw();
  } else if (!$("actUser")) actDraw();  // Actions reads Aternity only when Show is pressed: no minute

  if (was !== t) scrollTo(0, TAB.scroll[t] || 0);
}
$("tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-t]");
  if (!b) return;
  if (b.dataset.t === TAB.now) { scrollTo(0, 0); return; }  // the open tab: back to its top
  openTab(b.dataset.t);
});
addEventListener("hashchange", () => { if (TAB.now && tabOfLink() !== TAB.now) openTab(tabOfLink()); });

function dayName(d, today) {
  const t = new Date(d + "T12:00:00Z");
  const words = t.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  return d === today ? `Today, ${words}` : words;
}

// 24 (or any number of) vertical bars; labels every `every`; a title on each bar is its hover text
function bars(values, label, opts = {}) {
  const W = 480, H = opts.h || 84, top = 12, base = H - 16, n = Math.max(values.length, opts.slots || 0, 1), w = W / n;
  const off = n - values.length;  // empty slots at the left
  const max = Math.max(1, ...values);
  let s = `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">`;
  s += `<line x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}"/>`;
  s += `<text x="0" y="9">${esc(opts.unit ? `most: ${fmt(max)} ${opts.unit}` : `most: ${fmt(max)}`)}</text>`;
  values.forEach((v, i) => {
    const h = v ? Math.max(2, (base - top) * v / max) : 0, x = (i + off) * w;
    const sel = opts.sel === i ? " sel" : "";
    s += `<g${opts.click ? ` class="day" data-i="${i}"` : ""}><title>${esc(label(i, v))}</title>`
      + `<rect class="hit" x="${x}" y="0" width="${w}" height="${base}"/>`
      + (h ? `<rect class="v${sel}" x="${x + 1}" y="${base - h}" width="${Math.max(1, w - 2)}" height="${h}" rx="2"/>` : "")
      + `</g>`;
    const tick = opts.tick ? opts.tick(i) : (i % (opts.every || 3) === 0 ? String(i).padStart(2, "0") : "");
    const mid = x + w / 2, at = mid > W - 16 ? `x="${W}" text-anchor="end"` : mid < 16 ? `x="0" text-anchor="start"` : `x="${mid}" text-anchor="middle"`;
    if (tick) s += `<text ${at} y="${H - 3}">${esc(tick)}</text>`;  // a label at an edge stays inside
  });
  return s + "</svg>";
}
const hourBars = (v, what, aria) => bars(v, (h, n) => `${String(h).padStart(2, "0")}:00–${String(h).padStart(2, "0")}:59: ${plural(n, what)}`, { aria });

function hlist(rows) {  // [label, n] as horizontal bars
  if (!rows.length) return `<p class="muted small">None.</p>`;
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="hl">${rows.map(([l, n]) => `<span>${esc(l)}</span><i style="width:${(100 * n / max).toFixed(1)}%"></i><span class="n">${fmt(n)}</span>`).join("")}</div>`;
}
function nums(items) {
  return `<div class="nums">${items.map(([v, l, cls]) => `<div><b class="${cls || ""}">${v}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
}
// no one found on the address: still looked up at each read (Aternity sends rows late), or not known for good
const nobody = x => `<span class="muted">${x.waiting ? "waiting for Aternity" : "not known"}</span> <span class="small muted">(${esc(x.addr || "no address")})</span>`;
// Active Directory (ad.Lookup): each username and desktop on the page looked up once a day, in
// memory only; asked after the page is drawn, so the page never waits on AD
const AD = { users: {}, pcs: {}, res: null, busy: false, again: false, keptH: 24 };
const AD_ASK = 200;  // names of each kind in one request (ad.ASK_MAX)
function adGot(kept, name) {
  const x = kept[name];
  return x && Date.now() - x.at < AD.keptH * 3600e3 ? x.v : null;
}
function adUser(name) {
  const x = adGot(AD.users, name);
  if (!x) return "";
  if (!x.found) return ` <span class="small muted">not in AD</span>`;
  let main = [x.name, x.department].filter(Boolean), more = [x.title, x.office].filter(Boolean);
  if (!main.length) [main, more] = [more, []];
  return (main.length ? ` · <span title="${esc(more.join(" · "))}">${esc(main.join(" · "))}</span>` : "")
    + (x.disabled ? ` <span class="bad small">disabled in AD</span>` : "");
}
function adPc(name) {
  const x = adGot(AD.pcs, name);
  if (!x) return "";
  if (!x.found) return ` <span class="small muted">not in AD</span>`;
  const parts = [x.ou && "in " + x.ou, x.description].filter(Boolean);
  return (parts.length ? `<br><span class="small muted" title="${esc(x.os || "")}">${esc(parts.join(" · "))}</span>` : "")
    + (x.disabled ? ` <span class="bad small">disabled in AD</span>` : "");
}
function adLine() {
  const x = AD.res;
  if (!x || x.state === "ok") return "";
  if (x.state === "off") return `<p class="muted small">Names from Active Directory: not set (${esc(x.why)}; then docker compose up -d).</p>`;
  if (x.state === "refused") return `<p class="note"><span class="bad">Active Directory refused the login of AD_USERNAME (${esc(x.why)}).</span> `
    + `It is not tried again until the app restarts: correct .env, then docker compose up -d.</p>`;
  return `<p class="note">Active Directory did not answer (${esc(x.why)}). It is tried again in up to ${x.retry_min || 5} min; names already looked up are shown.</p>`;
}
function adFill() {
  document.querySelectorAll("[data-adu]").forEach(el => { el.innerHTML = adUser(el.dataset.adu); });
  document.querySelectorAll("[data-adp]").forEach(el => { el.innerHTML = adPc(el.dataset.adp); });
  const line = $("adLine");
  if (line) line.innerHTML = adLine();
}
// every name on the page not looked up yet: the people panel's, and SecureView's people
function adWanted() {
  const j = state.data, people = j && j.people ? j.people : [];
  const users = [...new Set([...people.filter(p => p.who).map(p => p.who), ...svUsers()])].filter(n => !adGot(AD.users, n));
  const pcs = [...new Set(people.flatMap(p => p.pcs || []))].filter(n => !adGot(AD.pcs, n));
  return { users, pcs };
}
async function adLook() {
  if (AD.busy) { AD.again = true; return; }  // asked while a look-up runs: once more after it, with the names then
  if (AD.res && (AD.res.state === "off" || AD.res.state === "refused")) return;  // known until a restart
  AD.busy = true;
  try {
    do {
      AD.again = false;
      const { users, pcs } = adWanted();
      for (let i = 0; i < Math.max(users.length, pcs.length); i += AD_ASK) {
        const r = await fetch("admin/api/ad", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ users: users.slice(i, i + AD_ASK), pcs: pcs.slice(i, i + AD_ASK) }) });
        const x = await readJson(r);
        if (r.status === 401) return;  // the next load shows the login
        if (!r.ok) { AD.res = { state: "down", why: x.detail || `HTTP ${r.status}` }; return; }
        AD.res = x; AD.keptH = x.kept_h || 24;
        const now = Date.now();
        for (const [k, v] of Object.entries(x.users || {})) AD.users[k] = { at: now, v };
        for (const [k, v] of Object.entries(x.pcs || {})) AD.pcs[k] = { at: now, v };
        if (x.state !== "ok") return;  // not set, refused or not answering: the line says so
      }
    } while (AD.again);
  } catch (e) {
    AD.res = { state: "down", why: "UX Correlator did not answer: " + e.message };
  } finally { AD.busy = false; adFill(); svAdDone(); }
}

function person(p) {
  if (!p.who) return nobody(p);
  let s = `<b>${esc(p.who)}</b><span class="ad" data-adu="${esc(p.who)}">${adUser(p.who)}</span>`;
  if (p.others && p.others.length > 1) s += ` <span class="small muted">one of ${p.others.length} on it then: ${esc(p.others.join(", "))}</span>`;
  return s;
}
function desk(p, ad) {  // ad: with each desktop's AD details (the table; the Now list is short)
  if (!p.pcs || !p.pcs.length) return `<span class="muted">–</span>`;
  const kind = KIND[p.kind] ? ` <span class="small muted">${KIND[p.kind]}</span>` : "";
  if (!ad) return esc(p.pcs.join(", ")) + kind;
  return p.pcs.map((c, i) => `<div>${esc(c)}${i ? "" : kind}<span class="ad" data-adp="${esc(c)}">${adPc(c)}</span></div>`).join("");
}
function did(p) {
  const parts = [];
  if (p.investigations) parts.push(plural(p.investigations, "investigation"));
  if (p.questions) parts.push(plural(p.questions, "question"));
  if (p.startups) parts.push(plural(p.startups, "start-ups report"));
  if (p.software) parts.push(plural(p.software, "Software click"));
  if (p.explains) parts.push(plural(p.explains, "Explain"));
  return parts.length ? esc(parts.join(", ")) : `<span class="muted">looked only</span>`;
}

function peoplePanel(j) {
  const dayWord = j.today ? "today" : dayName(j.date, "");
  let s = `<section class="panel"><h2>People using the app</h2><div id="adLine">${adLine()}</div>`;
  if (j.note) s += `<p class="note">${esc(j.note)}</p>`;
  if (j.today) {
    s += `<h3>Now <span class="muted small">(a visit in the last ${j.now_min} min)</span></h3>`;
    s += j.active.length ? `<ul class="plain">${j.active.map(p => `<li>${[person(p), p.pcs.length ? desk(p) : "", p.tab_now ? esc(p.tab_now) + " tab" : "", "last at " + esc(p.last_local)].filter(Boolean).join(" · ")}</li>`).join("")}</ul>`
      : `<p class="muted">No one in the last ${j.now_min} minutes.</p>`;
  }
  // named people only: a row with no name is an address (waiting for Aternity, or not known), not a person
  const named = j.people.filter(p => p.who).length, waiting = j.people.filter(p => !p.who && p.waiting).length,
    unknown = j.people.filter(p => !p.who && !p.waiting).length;
  s += `<h3>${j.today ? "Today" : esc(dayWord)}: ${plural(named, "person", "people")}`
    + `${waiting ? `, ${plural(waiting, "address", "addresses")} waiting for Aternity` : ""}`
    + `${unknown ? `, ${plural(unknown, "address", "addresses")} not known` : ""}</h3>`;
  if (j.people.length) {
    s += `<div class="tableWrap"><table class="people"><thead><tr><th>Person</th><th>Desktop</th><th>Visits</th><th>Tabs used</th><th>Did</th></tr></thead><tbody>`
      + j.people.map(p => `<tr><td>${person(p)}</td><td>${desk(p, true)}</td><td class="n">${esc(p.first_local)}–${esc(p.last_local)}</td>`
        + `<td>${esc(p.tabs.join(", ") || "–")}</td><td>${did(p)}</td></tr>`).join("")
      + `</tbody></table></div>`;
  } else s += `<p class="muted">No one opened the app${j.today ? " yet today" : " that day"}.</p>`;
  s += `<p class="muted small">A person is the user Aternity saw on the visit's address, its action nearest the visit within ${j.match_min} min `
    + `(read with Today's every ${j.reads.every_min} min). "Waiting for Aternity": looked up again at each read`
    + `${j.today && j.next_read_local ? ` (the next at ${esc(j.next_read_local)})` : ""}; Aternity sends rows late, so it can take a read or two. `
    + `"Not known": ${j.give_up_h} hours after the visit, still no action from that address (no agent, a VPN address, or no action `
    + `near the visit). Name and department, and each desktop's OU and description: Active Directory, looked up once a day `
    + `(title, office and the desktop's Windows on hover). Times in ${esc(j.zone)}.</p></section>`;
  return s;
}

function usePanel(j) {
  const inv = j.investigations, sec = inv.seconds;
  let s = `<section class="panel"><h2>Use of the app</h2>`;
  s += nums([[fmt(j.pages.total), "tabs opened"], [fmt(inv.n), "investigations"], [fmt(j.startups.n), "start-ups reports"],
    [fmt(j.software.n), "Software clicks"], [fmt(j.explain.n), "Explain uses"]]);
  s += `<h3>Tabs opened by hour</h3>` + hourBars(j.pages.by_hour, "tab opened", "Tabs opened by hour");
  s += `<h3>By tab</h3>` + hlist(j.pages.by_tab.map(t => [t.tab, t.n]));
  s += `<h3>Investigations</h3>`;
  if (inv.n) {
    s += `<p class="small">${plural(inv.n, "investigation")}${inv.failed ? `, <span class="bad">${fmt(inv.failed)} failed</span>` : ""}`
      + (sec ? `; time taken: typical ${dur(sec.typical)}, ${dur(sec.least)} to ${dur(sec.most)}` : "") + `.</p>`;
    s += `<p class="muted small">Started from</p>` + hlist(inv.by.map(([b, n]) => [BY[b] || b, n]));
    s += `<p class="muted small" style="margin-top:10px">What each found first</p>` + hlist(inv.found);
  } else s += `<p class="muted small">None.</p>`;
  const su = j.startups;
  s += `<h3>Start-ups reports</h3><p class="small">${su.n ? plural(su.n, "report") + (su.failed ? `, <span class="bad">${fmt(su.failed)} failed</span>` : "")
    + (su.seconds ? `; typical ${dur(su.seconds.typical)}, longest ${dur(su.seconds.most)}` : "") + "." : `<span class="muted">None.</span>`}</p>`;
  s += `<h3>Software clicks</h3>` + hlist(j.software.by);
  s += `<h3>Explain ▸</h3>` + hlist(j.explain.by);
  return s + `</section>`;
}

function askPanel(j) {
  const a = j.ask;
  let s = `<section class="panel"><h2>Ask anything</h2>`;
  s += nums([[fmt(a.n), "questions"], [fmt(a.steps), "look-ups"], [fmt(a.failed_lookups), "look-ups failed", a.failed_lookups ? "bad" : ""],
    [fmt(a.flagged), "answers with a number flagged", a.flagged ? "warn" : ""], [fmt(a.failed), "questions with no answer", a.failed ? "bad" : ""]]);

const MON3 = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function svDay(d, word = true) {  // "Mon Sep 28", today "Today"

async function svLoad() {
  if (TAB.now !== "sv") return;  // a minute that ends on the other tab, or after logging out
  clearTimeout(SV.timer); SV.timer = null;
  const seq = ++TAB.seq.sv;  // the latest read wins; one sent before a log-out is dropped
  const say = t => { if (TAB.now === "sv") $("err").textContent = t; };
  let r, text;
  try {
    r = await fetch("admin/api/secureview", { cache: "no-store" });
    text = await r.text();
  } catch (e) {
    if (seq !== TAB.seq.sv) return;
    say("UX Correlator did not answer: " + e.message + ". Trying again in a minute.");
    SV.timer = setTimeout(svLoad, 60000);
    return;
  }
  if (seq !== TAB.seq.sv) return;
  if (r.status === 401) { showLogin(await me()); return; }
  SV.timer = setTimeout(() => { if (!document.hidden) svLoad(); else SV.timer = setTimeout(svLoad, 60000); }, 60000);
  let j = null;
  try { j = JSON.parse(text); } catch (e) { /* not JSON: a proxy's page */ }
  if (!r.ok || !j) {
    say((j && j.detail) || `UX Correlator answered HTTP ${r.status}${r.status >= 502 ? ": the app may be restarting" : ""}.`);
    return;
  }
  say("");
  if (text === SV.text) return;
  const typing = document.activeElement && $("sv").contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
  if (typing && SV.j) { clearTimeout(SV.timer); SV.timer = setTimeout(svLoad, 15000); return; }  // drawn once the box is left
  SV.text = text; SV.j = j;
  svDraw();
  adLook();
}

// bars with an optional usual band (lowest to highest); a title on each is its hover text
function svChart(vals, opts) {
  const W = 480, H = 120, L = 24, B = 18, T = 8, n = Math.max(vals.length, 1), cw = (W - L) / n;
  const max = Math.max(1, ...vals.map(v => Math.max(v.v ?? 0, v.hi ?? 0)));
  const step = max <= 4 ? 1 : max <= 10 ? 2 : max <= 40 ? 10 : max <= 100 ? 20 : 10 ** Math.floor(Math.log10(max)) * (max / 10 ** Math.floor(Math.log10(max)) > 5 ? 2 : 1);
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  let s = `<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  for (const g of [top / 2, top]) if (Number.isInteger(g)) s += `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke-dasharray="2 3"/><text x="${L - 4}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
  vals.forEach((v, k) => {
    const x = L + k * cw;
    s += `<g class="h"><title>${esc(v.title)}</title><rect x="${x}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent"/>`;
    if (v.lo != null) s += `<rect class="band" x="${x + cw * 0.08}" y="${y(v.hi)}" width="${cw * 0.84}" height="${Math.max(1, y(v.lo) - y(v.hi))}" rx="2"/>`;
    if (v.v) s += `<rect class="v ${v.cls || ""}" x="${x + cw * (opts.thin ? 0.2 : 0.28)}" y="${y(v.v)}" width="${cw * (opts.thin ? 0.6 : 0.44)}" height="${Math.max(0.5, y(0) - y(v.v))}" rx="${opts.thin ? 1 : 3}"/>`;
    s += `</g>`;
    if (v.lab) s += `<text x="${Math.min(W - 12, Math.max(L + 12, x + cw / 2))}" y="${H - 5}" text-anchor="middle">${esc(v.lab)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${s}</svg>`;
}
// By department, across the page in columns read down each one, most first (the user's pick B, 2026-11-17: beside the
// hour chart, 15-20 departments left the space under the chart empty). rows: [department, n, of, note, what n is];
// sel: the Department box's; a click on a row sets the box (again: every department), the groups that are not a

const svDeptRows = (rows, sel, hist) => rows.length ? `<div class="dcols${hist ? " hist" : ""}">` + rows.map(([a, n, of, note, what]) =>
  `<button type="button" class="dr${a === sel ? " on" : ""}${SV_NOT_DEPT.includes(a) ? " not" : ""}" data-dept="${esc(a)}" aria-pressed="${a === sel}" `
  + `title="${esc(`${a}: ${fmt(n)} of ${fmt(of)} ${what}${note ? `, ${note}` : ""}. ${a === sel ? "Click again for every department." : "Click to list its devices."}`)}">`
  + `<span class="nm">${esc(a)}</span><span class="trk"><i style="width:${(100 * n / Math.max(1, of)).toFixed(1)}%"></i></span>`
  + `<span class="n">${fmt(n)} <span class="muted">of ${fmt(of)}</span></span>${hist ? `<span class="nt muted small">${note ? `· ${esc(note)}` : ""}</span>` : ""}</button>`).join("")
  + `</div>` : `<p class="muted small">None.</p>`;
function svDeptPick(box, key, body, list) {  // a department row clicked: the Department box and the list follow

function svAdState() {  // why there are no departments yet, or ""
  const x = AD.res;
  if (x && x.state === "off") return "Departments come from Active Directory, which is not set (see People using the app).";
  if (x && x.state === "refused") return "Active Directory refused the login, so there are no departments.";
  if (x && x.state === "down") return "Active Directory did not answer: departments as far as known.";
  return "";
}
// department -> [devices, people] over a list of [device, users]
function svByDept(list) {
  const per = new Map(), wait = new Set();
  for (const [dev, users] of list) {
    const ds = new Set();
    for (const u of users) { const d = svDept(u); if (d == null) wait.add(dev); else ds.add(d); }
    for (const d of ds) per.set(d, (per.get(d) || 0) + 1);
  }
  return { rows: [...per].sort(svDeptOrder), wait: wait.size };
}
const SV_NOT_DEPT = ["no department in AD", "not in AD", "no person recorded"];  // after the departments
function svDeptOrder(a, b) {
  const x = SV_NOT_DEPT.indexOf(a[0]), y = SV_NOT_DEPT.indexOf(b[0]);
  if (x !== y) return x - y;
  const n = v => Array.isArray(v) ? v[1] : v;
  return n(b[1]) - n(a[1]) || a[0].localeCompare(b[0]);
}
function svDeptOptions(sel, users, extra = []) {
  const ds = [...new Set([...users.map(svDept).filter(Boolean), ...extra])].sort((a, b) => SV_NOT_DEPT.indexOf(a) - SV_NOT_DEPT.indexOf(b) || a.localeCompare(b));
  return `<option value="">Every department</option>` + ds.map(d => `<option${d === sel ? " selected" : ""}>${esc(d)}</option>`).join("")
    + (sel && !ds.includes(sel) ? `<option selected>${esc(sel)}</option>` : "");
}

// ---------- Today ----------

    title: `${String(h.hour).padStart(2, "0")}:00–${String(h.hour).padStart(2, "0")}:59: ` + (h.n != null ? `${plural(h.n, "device")} heard${h.hour === cur ? " (so far)" : ""}` : "not yet")
      + (h.low != null ? `; usual ${h.low} to ${h.high}` : "") }));
  const longest = t.devices.slice().sort((a, b) => (b.last - b.first) - (a.last - a.first)).slice(0, 5);

    + `<div class="legend"><span><i style="background:var(--accent)"></i>today</span><span><i style="background:var(--brass)"></i>this hour so far</span>`
    + `<span><i style="background:var(--band)"></i>usual: lowest to highest, ${u.low != null ? `${u.days} ${kind} days` : "not known yet"}</span></div></div>`
    + `<div><h3>Longest in use today <span class="muted small">(first to last heard)</span></h3><div class="small">`
    + (longest.length ? longest.map(x => `${esc(x.name)} · ${esc(x.first_local)}–${esc(x.last_local)}`).join("<br>") : `<span class="muted">None yet.</span>`) + `</div></div></div>`
    + `<h3>By department <span class="muted small">(the people's, from AD: devices in use today; click one to list its devices)</span></h3><div id="svTDept">${svTDept(j)}</div>`
    + `<h3>In use today <span class="muted small">(${fmt(t.devices.length)})</span></h3>`
    + `<div class="tools"><input id="svTq" placeholder="Search a device, person, department or desktop" aria-label="Search" value="${esc(SV.tq)}">`
    + `<select id="svTdept" aria-label="Department">${svDeptOptions(SV.tdept, t.devices.flatMap(x => x.people.map(p => p.user)))}</select>`
    + `<select id="svTsort" aria-label="Sort">${[["first", "First heard"], ["last", "Last heard, latest first"], ["name", "Device name"]].map(([v, l]) => `<option value="${v}"${SV.tsort === v ? " selected" : ""}>${l}</option>`).join("")}</select></div>`
    + `<div class="tableWrap"><table class="sv"><thead><tr><th>Device</th><th class="n">First heard</th><th class="n">Last heard</th><th>Used by</th><th>Desktop</th></tr></thead><tbody id="svTbody"></tbody></table></div>`
    + `<button class="link" id="svTmore" style="margin-top:6px" hidden></button>`
    + `<p class="fine">The devices people sat at (Aternity's CLIENT_DEVICE_NAME) whose name matches <code>${esc(j.match)}</code> (secureview.match in config.yaml), any case. `
    + `First / last heard: the first and last action Aternity measured today on a virtual desktop opened from the device; Aternity has no connect or disconnect record, `
    + `and a session nobody uses sends nothing. <span class="dot"></span> heard in the last ${j.recent_min} min. Each person with their own first and last. `

function svTDept(j) {
  const d = svByDept(j.today.devices.map(x => [x.name, x.people.map(p => p.user)]));
  const why = svAdState();
  return (d.rows.length ? svDeptRows(d.rows.map(([a, n]) => [a, n, j.today.devices.length, "", "devices in use today"]), SV.tdept)
    : why ? "" : `<p class="muted small">${j.today.devices.length ? "" : "None."}</p>`)
    + (d.wait && !why ? `<p class="muted small">${plural(d.wait, "device")} waiting for Active Directory.</p>` : "")
    + (why ? `<p class="muted small">${esc(why)}</p>` : "")
    + (d.rows.length ? `<p class="muted small">A device two people of different departments used counts under both.</p>` : "");
}
function svTRows() {
  const t = SV.j.today, q = SV.tq.trim().toLowerCase();
  let rows = t.devices.filter(x => (!SV.tdept || x.people.some(p => svDept(p.user) === SV.tdept))
    && (!q || [x.name, ...x.desktops, ...x.people.flatMap(p => { const a = adGot(AD.users, p.user); return [p.user, a && a.name, a && a.department]; })]

const SV_NO_PERSON = "no person recorded";  // History: a device with no person on any day kept

const SV_TIMES = `First and last heard: to the minute from SecureView's own records; "08:xx" is the hour only, from Aternity's hourly data; `

const svHDeptOptions = j => svDeptOptions(SV.hdept, j.history.devices.filter(x => x.person).map(x => x.person),
  j.history.devices.some(x => !x.person) ? [SV_NO_PERSON] : []);
function svHDept(j) {
  const ds = j.history.devices, per = new Map();

    const d = x.person ? svDept(x.person) : SV_NO_PERSON;
    if (d == null) { wait++; continue; }
    if (!x.person) none++;
    const v = per.get(d) || [0, 0, 0];
    v[0] += x.silent < j.new_days; v[1] += 1; v[2] += x.silent >= 90;
    per.set(d, v);
  }
  const why = svAdState();
  const rows = [...per].sort(svDeptOrder).map(([d, v]) => [d, v[0], v[1], v[2] ? `${v[2]} silent 90+` : "", `heard in the last ${j.new_days} days`]);
  return svDeptRows(rows, SV.hdept, true) + (wait && !why ? `<p class="muted small">${plural(wait, "device")} waiting for Active Directory.</p>` : "")
    + (why ? `<p class="muted small">${esc(why)}</p>` : "")
    + (none ? `<p class="muted small">"No person recorded": neither SecureView nor Aternity named anyone on its days.</p>` : "");

function svHRows() {

function download(name, lines) {  // a CSV file of these lines

    ["Day", "Device", "Device heard", "People on it"],

// ---------- Code: this app's own source, listed, shown and asked about (code_chat.py) ----------
// Two sub-tabs. Ask: the AI looks things up in the source files on this host and answers; under each answer the
// lines it names, read from the disk by the app, and what it looked at; what it names that is in none of it is
// marked. Files (no AI): every file with what it does, its parts and its code; lines picked there can be asked
// about. Nothing is kept: a reload, or a log-out, starts a new chat.
const CODE = { view: "ask", j: null, err: "", seq: 0, aseq: 0, file: null, ferr: "", cache: {}, kind: "", pq: "", sel: null, wide: false, top: 0,
  sq: "", sres: null, sbusy: false, serr: "", about: null, answers: [], history: [], busy: false, doing: "", started: 0, aerr: "",
  draft: "", fresh: false, timer: null };
const CODE_ROWS = 15;  // rows of a look-up drawn under an answer
const CODE_ANSWERS = 10;  // answers kept on the page
const CODE_KINDS = [["", "All"], ["s", "Settings"], ["f", "Functions"], ["c", "Classes"]];
const CODE_KIND = { setting: "s", field: "s", function: "f", method: "f", class: "c" };  // a part's kind -> its chip
// a place as an answer writes it, "web.py:655-700": a link to those lines in Files
const CODE_CITE = /((?:static\/)?[A-Za-z_][\w-]*\.(?:py|html)):(\d{1,5})(?:\s*[-‐-―]\s*(\d{1,5}))?/g;
function codePick(name) {  // the listed file a written name means ("admin.html" is static/admin.html)
  const fs = CODE.j ? CODE.j.files.map(f => f.file) : [], t = String(name).toLowerCase();
  return fs.find(f => f.toLowerCase() === t) || fs.find(f => f.toLowerCase().split("/").pop() === t.split("/").pop()) || null;
}
const codeSpan = (a, b) => b > a ? `lines ${fmt(a)}-${fmt(b)}` : `line ${fmt(a)}`;
async function codeLoad() {
  if (TAB.now !== "code") return;
  const seq = ++CODE.seq;  // one sent before a log-out is dropped
  try {
    const r = await fetch("admin/api/code", { cache: "no-store" });
    const j = await readJson(r);
    if (seq !== CODE.seq) return;
    if (r.status === 401) { showLogin(await me()); return; }
    if (r.ok) { CODE.j = j; CODE.err = ""; } else CODE.err = j.detail || `HTTP ${r.status}`;
  } catch (e) {
    if (seq !== CODE.seq) return;
    CODE.err = "UX Correlator did not answer: " + e.message;
  }
  if (TAB.now === "code") codeDraw();
}
function codeDraw() {
  const j = CODE.j;
  if ($("codeView")) CODE.top = $("codeView").scrollTop;  // where the code was read to: kept across Ask and back
  if (!j) { $("code").innerHTML = `<h2>Code</h2><p class="${CODE.err ? "bad" : "muted"}">${esc(CODE.err || "Loading…")}</p>`; return; }
  if (CODE.view === "ask") CODE.fresh = false;
  $("code").innerHTML = `<div class="ph"><h2>Code</h2><div class="subtabs" role="tablist">`
    + [["ask", "Ask"], ["files", "Files"]].map(([v, w]) => `<button class="${CODE.view === v ? "on" : ""}" data-cv="${v}" role="tab" aria-selected="${CODE.view === v}">${w}${v === "ask" && CODE.fresh ? " · new answer" : ""}</button>`).join("")
    + `</div><span class="asof" id="codeCount">${plural(j.files.length, "file")}, ${fmt(j.total_lines)} lines · the app's own source on this host</span></div>`
    + `<div id="codeBody"></div>`;
  codeBody();
}
function codeBody() {
  const box = $("codeBody");
  if (!box) return;
  const typing = document.activeElement && document.activeElement.id;  // a box being typed in keeps its place
  if ($("codeView")) CODE.top = $("codeView").scrollTop;
  box.innerHTML = CODE.view === "ask" ? codeAskHtml() : CODE.file || CODE.ferr ? codeFileHtml() : codeListHtml();
  if (CODE.view === "files" && CODE.file) { codeSelPaint(); $("codeView").scrollTop = CODE.top; }
  if (typing && $(typing) && ["codeQ", "codeSq", "codePq"].includes(typing)) { const el = $(typing); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

// -- Ask --
function codeBusyText() {
  return CODE.busy ? `Looking in the code… ${Math.round((Date.now() - CODE.started) / 1000)} s${CODE.doing ? " — " + CODE.doing : ""}` : "";
}
function codeAskHtml() {
  const j = CODE.j, ab = CODE.about;
  let h = `<p class="muted small">Ask about this app's code in plain words: what a file does, where a setting is, which part does something. `
    + `The AI looks in the source files on this host and says where it found it. A follow-up question remembers the answers before.</p>`;
  if (!j.service) return h + `<p class="note">The chat needs an AI service: <code>ai.services</code> in config.yaml (<code>uxcorrelate verify --ai</code> checks it). The Files part works without one.</p>`;
  if (ab) h += `<p class="cabout" id="codeAbout">About <b>${esc(ab.file)}</b>, ${codeSpan(ab.start, ab.end)}${ab.part ? ` (${esc(ab.part)})` : ""}: the next question is about them. `
