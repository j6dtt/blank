# ===================== SETTINGS =====================
# UX Correlator on Kubernetes. Fill in every <...> in
# this file (the objects below use them too):
#   <REGISTRY>       registry the cluster pulls from
#                    (step 2)
#   <NFS_SERVER>     NFS server of the app folder
#   <NFS_PATH>       the app folder's path on it: the
#                    folder with src/, data/,
#                    config.yaml, .env, certs/
#   <MEMORY>         memory limit (step 1)
# The way in has its own file, one of (SWITCH below):
#   k8s/ingress.yaml       ingress-nginx; its <HOST>,
#                          <INGRESS_CLASS>
#   k8s/loadbalancer.yaml  a load balancer straight to
#                          the pod's HTTPS
# The certificate in certs/ must be for the name
# users type in the browser.
# ====================================================
#
# ------------------- HOW IT RUNS --------------------
# ONE pod serves two ports, as compose does:
#   :8080 http, for the ingress (it trusts the
#         ingress's X-Forwarded-For: the user's PC)
#   :8444 https, the certificate from the Secret
#         "uxcorrelate-tls" (a browser's own
#         X-Forwarded-For is never trusted here)
# Ingress way:
#   browser ─https─▶ Ingress ─▶ Service :80 ─▶ :8080
# Load-balancer way:
#   browser ─https─▶ LB :8444 ─▶ :8444 (TLS in the pod)
# The pod mounts the app folder on NFS:
#     src/        → /app/src   code, read-only
#     the folder  → /srv/app   config.yaml, read-only
#     data/       → /data      daily counts, Care list
# Passwords and keys: Secret "uxcorrelate-env", made
# from .env by hand, given to the pod as environment
# variables (as compose's env_file does). This file
# holds no password.
# One pod, never more: it reads Aternity in the
# background, so a second pod would read it twice and
# run every Care list investigation twice.
# The web UI has no login: anyone who can reach
# <HOST> can use it.
#
# ------------------- FIRST TIME ---------------------
# 1. On the host that runs compose today, in the app
#    folder. MEM USAGE times 2 is <MEMORY> (after the
#    app has run a day):
#      docker stats --no-stream uxcorrelate
#      chmod a+rwx data; chmod -R o+rX src
#    The cluster's nodes must be able to mount this
#    folder over NFS (<NFS_SERVER>:<NFS_PATH>).
#
# 2. Put the image in the registry, from a host with
#    docker that can push there. Skip the first two
#    lines if it already has the image
#    (docker images | grep uxcorrelate-runtime):
#      tar xf uxcorrelate-<version>.tar
#      docker load < uxcorrelate-<version>/image.tar.xz
#      docker tag uxcorrelate-runtime:4 <REGISTRY>/uxcorrelate-runtime:4
#      docker push <REGISTRY>/uxcorrelate-runtime:4
#
# 3. Fill in the SETTINGS values. Then nothing should
#    be printed by:
#      grep -n "<" k8s/*.yaml | grep -v "#"
#
# 4. .env: one KEY=value per line, no quotes around
#    values (kubectl keeps quotes; compose drops them).
#
# 5. Stop compose: both must never run at once.
#      docker compose down
#
# 6. From the app folder, with kubectl:
#      kubectl create namespace uxcorrelate
#      kubectl -n uxcorrelate create secret generic uxcorrelate-env --from-env-file=.env
#      kubectl -n uxcorrelate create secret tls uxcorrelate-tls --cert=certs/<name>.crt --key=certs/<name>.key
#      kubectl apply -f k8s/uxcorrelate.yaml
#    and the way in, one of:
#      kubectl apply -f k8s/ingress.yaml
#      kubectl apply -f k8s/loadbalancer.yaml
#
# 7. Check it runs:
#      kubectl -n uxcorrelate get pods
#    shows 1/1 Running; within minutes
#      kubectl -n uxcorrelate logs deploy/uxcorrelate --tail=20
#    shows "Today ready" and "HTTPS on port 8444".
#    Then open https://<HOST>/ (ingress) or
#    https://<HOST>:8444/ (load balancer). The Today
#    tab fills once the last 24 h are read.
#
# ---------------- SWITCH THE WAY IN -----------------
# Nothing to edit: the pod serves both ports always.
# To the load balancer:
#   kubectl apply -f k8s/loadbalancer.yaml
#   kubectl delete -f k8s/ingress.yaml
#   kubectl -n uxcorrelate get svc uxcorrelate-lb
#     (EXTERNAL-IP: point <HOST> at it in DNS)
# Back to the ingress:
#   kubectl apply -f k8s/ingress.yaml
#   kubectl delete -f k8s/loadbalancer.yaml
# Both at once also works (moving users over).
# Check either way: the admin page (/admin) names
# each visitor; "every visit from one address" means
# the way in hides the users' PCs.
#
# ------------------- DAY TO DAY ---------------------
# Code fix: copy the files into src/ in the app
# folder, then:
#   kubectl -n uxcorrelate rollout restart deploy/uxcorrelate
# The Care list is changed on the page (it is
# care_list.json on the data volume). config.yaml
# settings: rollout restart (as above).
# Password or AI key changed in .env: load it again,
# then rollout restart:
#   kubectl -n uxcorrelate create secret generic uxcorrelate-env --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
# New certificate, then rollout restart (the pod's own
# HTTPS reads it at start; the ingress needs none):
#   kubectl -n uxcorrelate create secret tls uxcorrelate-tls --cert=certs/<name>.crt --key=certs/<name>.key --dry-run=client -o yaml | kubectl apply -f -
# New image tag (x-image in compose.yaml changed):
# step 2 with the new tag, change "image:" below, then
#   kubectl apply -f k8s/uxcorrelate.yaml
# Logs, as they come:
#   kubectl -n uxcorrelate logs deploy/uxcorrelate -f
# verify and other CLI commands:
#   kubectl -n uxcorrelate exec deploy/uxcorrelate -- uxcorrelate verify
#
# ---------------- BACK TO COMPOSE -------------------
# Stop the pod, then start compose: data/ and
# config.yaml are where they were.
#   kubectl -n uxcorrelate scale deploy/uxcorrelate --replicas=0
#   docker compose up -d
# Remove it from the cluster (the NFS folder is kept):
#   kubectl delete -f k8s/ingress.yaml -f k8s/loadbalancer.yaml --ignore-not-found
#   kubectl delete -f k8s/uxcorrelate.yaml
#   kubectl delete namespace uxcorrelate
# ====================================================
# The app folder on NFS. Retain: deleting this never
# touches the folder.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: uxcorrelate-app
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: "<NFS_SERVER>"
    path: "<NFS_PATH>"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uxcorrelate-app
  namespace: uxcorrelate
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: uxcorrelate-app
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uxcorrelate
  namespace: uxcorrelate
spec:
  replicas: 1  # never more (see SETTINGS)
  strategy:
    type: Recreate  # the old pod stops before the new one starts
  selector:
    matchLabels:
      app: uxcorrelate
  template:
    metadata:
      labels:
        app: uxcorrelate
    spec:
      securityContext:  # the image's own user (uxc, 1000)
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: uxcorrelate
          image: "<REGISTRY>/uxcorrelate-runtime:4"
          imagePullPolicy: IfNotPresent
          # http for the ingress, https for the load balancer
          # (both always: SWITCH above needs no edit here)
          args: ["serve", "--host", "0.0.0.0", "--port", "8080",
                 "--tls-port", "8444", "--cert", "/certs/tls.crt", "--key", "/certs/tls.key"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8444
          env:
            - name: UXCORRELATE_CONFIG
              value: /srv/app/config.yaml
            - name: UXCORRELATE_DATA
              value: /data
            # port 8080 is reached only through the ingress: take
            # the user's address from its X-Forwarded-For header, so
            # the admin page and the Care list's log lines name their
            # PC. Port 8444 never takes it from a browser (cli.py).
            - name: FORWARDED_ALLOW_IPS
              value: "*"
          envFrom:
            - secretRef:
                name: uxcorrelate-env  # the passwords and keys from .env
          volumeMounts:
            - name: app
              mountPath: /app/src
              subPath: src
              readOnly: true
            # the folder, not the file: an edited config.yaml
            # is seen without a restart
            - name: app
              mountPath: /srv/app
              readOnly: true
            # daily counts and Care list issues; writable by 1000
            - name: app
              mountPath: /data
              subPath: data
            # the certificate (Secret "uxcorrelate-tls", step 6):
            # tls.crt and tls.key; a new one needs a rollout restart
            - name: tls
              mountPath: /certs
              readOnly: true
          # /api/health: answers at once, left out of the log
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: "<MEMORY>"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: uxcorrelate-app
        - name: tls
          secret:
            secretName: uxcorrelate-tls
---
# Inside the cluster only (ClusterIP): the ingress's way
# to the pod (k8s/ingress.yaml). Harmless when unused.
apiVersion: v1
kind: Service
metadata:
  name: uxcorrelate
  namespace: uxcorrelate
spec:
  selector:
    app: uxcorrelate
  ports:
    - name: http
      port: 80
      targetPort: http
