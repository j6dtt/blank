# Made-up Aternity, NetIM and Active Directory for the dev app (the dev host has no Riverbed, no AD).
# Not part of the product or the bundle: dev/sample_riverbed.py says what
# the made-up data holds. It joins the dev app's network, so config.yaml
# reaches it by name (README.md, "Sample data for the dev app"):
#   docker compose -f dev/compose.yaml up -d     then restart the app once
# At start it saves the past days' counts in the app's data/days (only the
# days missing), so the Today tab has a usual from the first read.

# ================================ SETTINGS ==================================
x-image: &image uxcorrelate-runtime:4     # the app's own runtime image (compose.yaml x-image)
x-ad-image: &ad_image diegogslomp/samba-ad-dc@sha256:9606e448ddd6d63a5707275e802bdc4f27e5eff1e3abbca2876f87001d1dcf40  # Samba 4.25.1
x-network: &network riverbed_default      # the dev app's network (its compose project's default)
# ============================================================================

name: sample-riverbed
services:
  sample-riverbed:
    image: *image
    container_name: sample-riverbed
    # Its own check: the image's asks the app's port 8080, which nothing here listens on, and this
    # server has no page at "/" (404). Aternity's list of sources is small, answers 200 and is not logged.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/aternity.odata/v2.0', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    user: "1000:1000"
    entrypoint: ["python", "/repo/dev/sample_riverbed.py", "serve", "--port", "8000", "--data", "/data"]
    environment:
      PYTHONPATH: /repo/src
    volumes:
      - ..:/repo:ro          # this file, the real Aternity $metadata (tests/fixtures), src for the saved days
      - ../data:/data        # the app's data folder
    networks: [app]
    restart: unless-stopped

  # A made-up Active Directory (dev/sample_ad.sh says what it holds): a real Samba domain
  # controller, so verify --ad meets real DNS SRV records, LDAPS, StartTLS and logins (not NTLM: Samba has
  # no Microsoft NTLM bind for LDAP). The app's
  # config.yaml: ad.domain ad.sample.test, ad.dns [sample-ad]; its .env: AD_USERNAME, AD_PASSWORD
  # (this container makes that account).
  sample-ad:
    image: *ad_image
    container_name: sample-ad
    hostname: dc1
    env_file: ../.env
    entrypoint: ["bash", "/sample_ad.sh"]
    volumes:
      - ./sample_ad.sh:/sample_ad.sh:ro
    cap_add: [SYS_ADMIN]   # Samba keeps its files' rights in extended attributes
    networks: [app]
    restart: unless-stopped

networks:
  app:
    name: *network
    external: true
