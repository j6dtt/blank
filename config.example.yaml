# UX Correlator: live settings. Copy to config.yaml, fill in every
# <REQUIRED> value, then run `uxcorrelate verify`.
# Passwords never go here: put ATERNITY_PASSWORD and NETIM_PASSWORD in .env.
# README.md, "Connect to Riverbed", says where to find each value.

aternity:
  # <REQUIRED> the OData URL on Aternity's REST API Access page,
  # e.g. https://<region>-odata.aternity.com/aternity.odata/v2.0
  base_url: ""
  # <REQUIRED> the Aternity user that owns the REST API access token
  username: ""

netim:
  # <REQUIRED> the NetIM core, e.g. https://<netim-core>:8543
  base_url: ""
  # <REQUIRED> a LOCAL NetIM user with ADMIN rights (not SAML/TACACS)
  username: ""

# Which NetIM devices sit on a user's path. Names must match exactly:
# applications and locations as Aternity shows them, devices as NetIM
# shows them. `uxcorrelate verify` checks every name. The user's own
# gateway is found automatically from the laptop's IP.
topology:
  applications: {}          # "<Aternity app>": [<server IP or NetIM device>, ...]
  sites: {}                 # "<Aternity location>": [<NetIM WAN router>, ...]
  always_include: []        # NetIM devices to check every time (core, firewall)

thresholds:
  # Aternity's activity status values that mean slow; `uxcorrelate verify`
  # lists the values your tenant uses. Empty: slow = over response_time_s.
  slow_status: []
  response_time_s: 3.0      # only while slow_status is empty
  response_time_s_by_app: {}  # "<Aternity app>": seconds
  device_cpu: 85
  device_memory: 90
  disk_queue: 2
  free_disk_percent: 10     # OS drive free space under this % is a problem
  client_network_latency_ms: 150

# a problem counts for a slow action up to this many minutes before or after it
bucket_minutes: 5
# unit of boot and logon durations, shown next to them
boot_unit: s

# "Today" runs from midnight in this time zone (as in Windows / Linux:
# Area/City, e.g. America/Chicago); the days and times written in an
# investigation's sentences are in it too. Empty: UTC.
timezone: ""

# how often the Today tab, the name list and the Care list read Aternity,
# in minutes (5 to 60; 15 if left out). Lower: issues show sooner, and
# Aternity is read more often. Restart after a change.
refresh_minutes: 15

# --- Only if `uxcorrelate verify` reports a wrong name ----------------
# The Aternity data sources and columns, NetIM API paths and NetIM metrics
# have built-in defaults (src/uxcorrelate/config.py). When verify says one
# is wrong, it prints the closest real names. Add just that one to the
# aternity: or netim: section ABOVE (a second aternity: key would replace
# the first one), for example:
#
# aternity:
#   entities:
#     activities: <data source>
#   fields:
#     activities:
#       response_time: <column>
# netim:
#   api_prefix: /api/netim/v1
#   metric_data_path: /swarm/NETIM_NETWORK_METRIC_DATA_SERVICE/api/v1/network-metric-data
#   alerts_path: <path>      # off by default; see NetIM HELP > API Documentation
#   parallel_reads: 8        # device interface lists read at once
#   metrics:                 # replaces the whole default list
#     - {key: if_util_out, label: "Interface utilization out (%)",
#        object_type: INTERFACE, metric_class: IFC_UTIL,
#        metric: utilizationOut, threshold: 80}

# The Care list tab: users checked every 15 min (up to 50). The list is
# data/care_list.json, changed on the page ("Add a user", a tile's
# "Remove"). care_list here is read once only, to make that file when it
# is not there yet (the list was here before); it is not read after that.
care_list: []
# - username: <as in Aternity>
#   label: <shown on the tile>

# Optional: self-hosted AI services for the chat (OpenAI-style chat API).
# Keys never go here: put each in .env, under the name given in key_env.
# `uxcorrelate verify --ai` checks each service and says what to change.
ai:
  chat: ""            # the name of the service the Today chat uses; empty: the first one below
  services: []
  # - name: ""        # your label for it, shown by verify
  #   base_url: ""    # the service's API address, up to and including /v1
  #   model: ""       # the model's name on that service (verify lists them)
  #   key_env: ""     # the .env line that holds its key, e.g. AI_KEY_1
