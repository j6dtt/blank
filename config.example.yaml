# UX Correlator: live settings. Copy to config.yaml, fill in every
# <REQUIRED> value, then run `uxcorrelate verify`.
# Passwords never go here: put ATERNITY_PASSWORD and NETIM_PASSWORD in .env.
# README.md, "Connect to Riverbed", says where to find each value.

aternity:
  # <REQUIRED> the OData URL on Aternity's REST API Access page,
  # e.g. https://<region>-odata.aternity.com/aternity.odata/v2.0
  base_url: ""
  # <REQUIRED> the Aternity user that owns the REST API access token
  username: ""

netim:
  # <REQUIRED> the NetIM core, e.g. https://<netim-core>:8543
  base_url: ""
  # <REQUIRED> a LOCAL NetIM user with ADMIN rights (not SAML/TACACS)
  username: ""

# Which NetIM devices sit on a user's path. Names must match exactly:
# applications and locations as Aternity shows them, devices as NetIM
# shows them. `uxcorrelate verify` checks every name. The user's own
# gateway is found automatically from the laptop's IP.
topology:
  applications: {}          # "<Aternity app>": [<server IP or NetIM device>, ...]
  sites: {}                 # "<Aternity location>": [<NetIM WAN router>, ...]
  always_include: []        # NetIM devices to check every time (core, firewall)

thresholds:
  response_time_s: 3.0      # an activity slower than this is "degraded"
  response_time_s_by_app: {}  # "<Aternity app>": seconds
  device_cpu: 85
  device_memory: 90
  client_network_latency_ms: 150

bucket_minutes: 5

# --- Only if `uxcorrelate verify` reports a wrong name ----------------
# The Aternity data sources and columns, NetIM API paths and NetIM metrics
# have built-in defaults (src/uxcorrelate/config.py). When verify says one
# is wrong, it prints the closest real names. Add just that one to the
# aternity: or netim: section ABOVE (a second aternity: key would replace
# the first one), for example:
#
# aternity:
#   entities:
#     activities: <data source>
#   fields:
#     activities:
#       response_time: <column>
# netim:
#   api_prefix: /api/netim/v1
#   metric_data_path: /swarm/NETIM_NETWORK_METRIC_DATA_SERVICE/api/v1/network-metric-data
#   alerts_path: <path>      # off by default; see NetIM HELP > API Documentation
#   metrics:                 # replaces the whole default list
#     - {key: if_util_out, label: "Interface utilization out (%)",
#        object_type: INTERFACE, metric_class: IFC_UTIL,
#        metric: utilizationOut, threshold: 80}
