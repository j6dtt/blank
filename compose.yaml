# ===================== SETTINGS =====================
# Runtime image: Python + libraries only, no app code.
# Dev builds it (docker compose build); the air-gapped
# live host loads it from the bundle made by
# scripts/make-bundle.sh and never builds. Bump the tag
# only when pyproject.toml dependencies change.
x-image: &image uxcorrelate-runtime:3

x-settings:
  # Host address:port for the web UI. The UI has no
  # login: use "8080:8080" only on a trusted network,
  # "127.0.0.1:8080:8080" for this host only.
  # HTTPS is 8443 in the container. On the host 8443
  # is haproxy's, so it is 8444 here; comment it out
  # for http only.
  ports: &ports
    - "8080:8080"
    - "8444:8443"
  # HTTPS: certificate and key in ./certs (not in git;
  # readable by uid 1000, the container's user).
  # Comment out the TLS lines = http only.
  command: &command
    - serve
    - --host=0.0.0.0
    - --port=8080
    - --tls-port=8443
    - --cert=/certs/ssl.lab.int.crt
    - --key=/certs/ssl.lab.int.key

# Before the first start:
#   1. cp config.example.yaml config.yaml, fill <REQUIRED>
#   2. put ATERNITY_PASSWORD / NETIM_PASSWORD in ./.env
#   3. docker compose up -d, then check the connection:
#      docker compose exec uxcorrelate uxcorrelate verify
# Code fix: edit ./src/uxcorrelate/*.py, then
#   docker compose restart
# Full steps: README.md, "Connect to Riverbed".
# ====================================================

services:
  uxcorrelate:
    build: .
    image: *image
    pull_policy: never
    container_name: uxcorrelate
    restart: unless-stopped
    command: *command
    ports: *ports
    env_file:
      - path: .env
        required: false
    environment:
      UXCORRELATE_CONFIG: /config/config.yaml
    volumes:
      - ./src:/app/src:ro
      - ./config.yaml:/config/config.yaml:ro
      - ./certs:/certs:ro
